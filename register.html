<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - UTM Clinic Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .register-card { 
            background: white; padding: 40px; border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 650px; text-align: center; 
        }

        .utm-logo { height: 70px; margin-bottom: 20px; }
        h2 { color: #333; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #777; font-size: 14px; margin-bottom: 30px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; }
        .form-group { margin-bottom: 15px; }
        .full-width { grid-column: span 2; }

        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 13px; }
        input, textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
            background-color: #f9f9f9; font-size: 14px; outline-color: #802c44; 
        }
        textarea { resize: none; }

        .btn-register {
            width: 100%; padding: 14px; background-color: #802c44; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .btn-register:hover { background-color: #612134; }

        .login-link { margin-top: 20px; font-size: 13px; color: #555; }
        .login-link a { color: #802c44; text-decoration: none; font-weight: 600; }

        .error-message { 
            background-color: #fee2e2; color: #b91c1c; padding: 10px; 
            border-radius: 8px; margin-bottom: 20px; font-size: 13px; display: none;
        }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="register-card">
        <img src="images/utm-logo.png" alt="UTM Logo" class="utm-logo">
        <h2>Create Account</h2>
        <p class="subtitle">Register to book appointments at UTM Clinic</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Ahmad bin Abdullah" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="ahmad@graduate.utm.my" required>
                </div>

                <div class="form-group">
                    <label>Matric Number</label>
                    <input type="text" id="matric" placeholder="A21EC0001" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" placeholder="012-3456789" required>
                </div>

                <div class="form-group full-width">
                    <label>Address</label>
                    <textarea id="address" rows="3" placeholder="Residential College, UTM"></textarea>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Minimum 8 characters" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                </div>
            </div>

            <button type="submit" class="btn-register">Create Account</button>
        </form>

        <p class="login-link">Already have an account? <a href="login.html">Sign in here</a></p>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const registerForm = document.getElementById('registerForm');
        const errorDiv = document.getElementById('errorMessage');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const name = document.getElementById('name').value;
            const matric = document.getElementById('matric').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.style.display = 'block';
                return;
            }

            try {
                // 1. Create user in Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Save additional data to Firestore
                // We default new registrations to 'patient' role
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    matric: matric,
                    phone: phone,
                    address: address,
                    role: 'patient',
                    createdAt: new Date().toISOString()
                });

                alert("Account created successfully!");
                window.location.href = 'login.html';

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
