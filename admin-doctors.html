<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Doctors - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#802c44',
                            light: '#f4e8ec',
                            hover: '#6a2438'
                        },
                        text: {
                            dark: '#1e293b',
                            muted: '#64748b'
                        },
                        borderCustom: '#e2e8f0',
                        bgBody: '#f8fafc'
                    },
                    borderRadius: {
                        'custom': '16px'
                    },
                    boxShadow: {
                        'custom': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        @media (max-width: 768px) {
            .sidebar-text { display: none; }
        }
    </style>
</head>
<body class="flex min-h-screen font-sans">

    <aside class="w-[80px] md:w-[280px] bg-white border-r border-borderCustom py-8 flex flex-col sticky top-0 h-screen transition-all duration-300">
        <div class="flex items-center gap-3 px-4 md:px-6 pb-10 justify-center md:justify-start">
            <div class="w-[42px] h-[42px] bg-primary rounded-[12px] flex items-center justify-center flex-shrink-0">
                <img src="images/Clinic-logo.png" alt="Logo" class="w-[80%] h-[80%] object-contain">
            </div>
            <div class="sidebar-text text-[22px] font-bold text-primary whitespace-nowrap">UTM Clinic</div>
        </div>

        <nav class="flex flex-col gap-1.5 px-3">
            <a href="admin_dashboard.html" class="flex items-center gap-3 px-4 py-3 text-text-muted hover:bg-primary-light hover:text-primary rounded-[12px] font-medium transition-all duration-300 justify-center md:justify-start">
                <i class="fas fa-columns text-lg"></i>
                <span class="sidebar-text">Admin Dashboard</span>
            </a>
            <a href="admin-doctors.html" class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-[12px] font-medium transition-all duration-300 justify-center md:justify-start">
                <i class="fas fa-user-md text-lg"></i>
                <span class="sidebar-text">Manage Doctors</span>
            </a>
            <a href="admin-staff.html" class="flex items-center gap-3 px-4 py-3 text-text-muted hover:bg-primary-light hover:text-primary rounded-[12px] font-medium transition-all duration-300 justify-center md:justify-start">
                <i class="fas fa-users-cog text-lg"></i>
                <span class="sidebar-text">Manage Staff</span>
            </a>
            <a href="admin-reports.html" class="flex items-center gap-3 px-4 py-3 text-text-muted hover:bg-primary-light hover:text-primary rounded-[12px] font-medium transition-all duration-300 justify-center md:justify-start">
                <i class="fas fa-chart-line text-lg"></i>
                <span class="sidebar-text">Sales Reports</span>
            </a>
        </nav>

        <div class="px-3 border-t border-borderCustom pt-5 mt-auto">
            <a href="login.html" id="logoutLink" class="flex items-center gap-3 px-4 py-3 text-[#ef4444] hover:bg-[#fef2f2] rounded-[12px] font-medium transition-all duration-300 justify-center md:justify-start">
                <i class="fas fa-sign-out-alt text-lg"></i>
                <span class="sidebar-text">Logout</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-text-dark">Manage Doctors</h1>
                <p class="text-text-muted text-base">Register, configure, and manage medical practitioners accounts</p>
            </div>
            <button onclick="openAddModal()" class="flex items-center gap-2 px-5 py-3 bg-primary text-white font-semibold rounded-[12px] hover:bg-primary-hover transition-colors shadow-sm">
                <i class="fas fa-plus"></i>
                <span>Add New Doctor</span>
            </button>
        </header>

        <div class="bg-white p-4 rounded-custom border border-borderCustom shadow-custom mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-muted">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="searchBar" placeholder="Search doctor name..." class="w-full pl-9 pr-4 py-2 border border-borderCustom rounded-[10px] focus:outline-none focus:border-primary text-sm bg-bgBody">
            </div>
            <div class="text-sm font-medium text-text-muted">
                Showing <span id="doctorCount" class="text-primary font-bold">0</span> Registered Doctors
            </div>
        </div>

        <div class="bg-white rounded-custom border border-borderCustom shadow-custom overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-bgBody border-b border-borderCustom text-xs uppercase tracking-wider text-text-muted font-bold">
                            <th class="px-6 py-4">Doctor Info</th>
                            <th class="px-6 py-4">Specialization</th>
                            <th class="px-6 py-4">Phone Number</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="doctorsTableBody" class="divide-y divide-borderCustom text-sm">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-text-muted">
                                <i class="fas fa-spinner fa-spin mr-2 text-primary"></i> Syncing doctors registry...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="doctorModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-custom shadow-2xl border border-borderCustom overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <div class="px-6 py-4 bg-primary text-white flex items-center justify-between">
                <h3 class="text-lg font-bold" id="modalTitle"><i class="fas fa-user-md mr-2"></i>Register New Doctor</h3>
                <button type="button" onclick="toggleModal(false)" class="text-white/80 hover:text-white transition-colors text-xl"><i class="fas fa-times"></i></button>
            </div>
            
            <form id="doctorForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-1">Full Name</label>
                    <input type="text" id="docName" placeholder="Dr. John Doe" required class="w-full px-4 py-2 border border-borderCustom rounded-[10px] focus:outline-none focus:border-primary text-sm bg-bgBody">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-1">Email Address</label>
                    <input type="email" id="docEmail" placeholder="john.doe@utm.my" required class="w-full px-4 py-2 border border-borderCustom rounded-[10px] focus:outline-none focus:border-primary text-sm bg-bgBody">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-1">Specialization</label>
                    <input type="text" id="docSpecialization" placeholder="e.g., General Practitioner" required class="w-full px-4 py-2 border border-borderCustom rounded-[10px] focus:outline-none focus:border-primary text-sm bg-bgBody">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-text-dark mb-1">Phone Number</label>
                    <input type="tel" id="docPhone" placeholder="+60 1X-XXXX XXX" required class="w-full px-4 py-2 border border-borderCustom rounded-[10px] focus:outline-none focus:border-primary text-sm bg-bgBody">
                </div>

                <div id="statusFieldContainer" class="hidden">
                    <label class="block text-sm font-semibold text-text-dark mb-1">Account Operational Status</label>
                    <select id="docStatus" class="w-full px-4 py-2 border border-borderCustom rounded-[10px] focus:outline-none focus:border-primary text-sm bg-bgBody font-medium">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-borderCustom mt-6">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm font-semibold text-text-muted hover:bg-bgBody rounded-[10px] transition-colors">Cancel</button>
                    <button type="submit" id="saveButton" class="px-5 py-2 text-sm font-semibold bg-primary text-white rounded-[10px] hover:bg-primary-hover transition-colors">Save Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        // Global state references
        let allDoctors = [];
        let currentEditId = null; // Stores target document reference tracking edit configurations

        // Track Active Session Secure Status
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "login.html";
        });

        // Setup Logout Trigger Pipeline
        document.getElementById('logoutLink')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = 'login.html';
        });

        const tableBody = document.getElementById("doctorsTableBody");
        const countBadge = document.getElementById("doctorCount");

        // Helper: Dynamically compile beautiful name initials fallback icons
        function getNameInitials(name) {
            const clean = name.replace(/^Dr\.\s+/i, '').trim();
            const tokens = clean.split(/\s+/);
            if (tokens.length >= 2) {
                return (tokens[0][0] + tokens[1][0]).toUpperCase();
            }
            return tokens[0] ? tokens[0].substring(0, 2).toUpperCase() : "DR";
        }

        // Render data rows cleanly to table DOM layout structure
        function renderDoctorsTable(doctorsArray) {
            if (doctorsArray.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-text-muted text-sm">
                            No medical practitioner logs match your query context.
                        </td>
                    </tr>`;
                return;
            }

            tableBody.innerHTML = "";
            doctorsArray.forEach((doctor) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-bgBody/50 transition-colors";
                
                const initials = getNameInitials(doctor.name);
                const email = doctor.email || `${doctor.name.toLowerCase().replace(/[^a-z0-9]/g, "")}@utm.my`;
                const phone = doctor.phone || "+60 11-1234 5678";
                const status = doctor.status || "Active";
                const badgeColor = status === "Active" ? "bg-green-100 text-green-700" : "bg-amber-100 text-amber-700";

                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-primary-light text-primary flex items-center justify-center font-bold text-base flex-shrink-0">
                                ${initials}
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-bold text-text-dark truncate">${doctor.name}</h4>
                                <p class="text-xs text-text-muted truncate">${email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 font-medium text-text-dark">${doctor.specialization || "General Practitioner"}</td>
                    <td class="px-6 py-4 text-text-muted whitespace-nowrap">${phone}</td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-1 font-semibold rounded-full text-xs ${badgeColor}">${status}</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button data-id="${doctor.id}" class="btn-edit w-8 h-8 text-text-muted hover:text-primary hover:bg-primary-light rounded-lg transition-colors" title="Edit Doctor Profile">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button data-id="${doctor.id}" class="btn-delete w-8 h-8 text-text-muted hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete Doctor Account">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            // Bind Event Listeners on real-time compiled dynamic trash icons
            document.querySelectorAll(".btn-delete").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    const docId = btn.getAttribute("data-id");
                    if (confirm("Are you sure you want to delete this doctor profile?")) {
                        try {
                            await deleteDoc(doc(db, "doctors", docId));
                        } catch (error) {
                            alert("Operation structural exception: " + error.message);
                        }
                    }
                });
            });

            // Bind Event Listeners for Edit target selectors
            document.querySelectorAll(".btn-edit").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const docId = btn.getAttribute("data-id");
                    const doctorData = allDoctors.find(d => d.id === docId);
                    if (doctorData) {
                        openEditModal(doctorData);
                    }
                });
            });
        }

        // Live Registry Listener Pipeline Subscriptions
        onSnapshot(collection(db, "doctors"), (snapshot) => {
            allDoctors = [];
            snapshot.forEach((docSnapshot) => {
                allDoctors.push({
                    id: docSnapshot.id,
                    ...docSnapshot.data()
                });
            });
            countBadge.innerText = allDoctors.length;
            renderDoctorsTable(allDoctors);
        }, (err) => {
            console.error("Firestore read error: ", err);
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-red-600 font-medium">Syncing data failed.</td></tr>`;
        });

        // Native Search Input Filter Loop Configuration
        document.getElementById("searchBar").addEventListener("input", (e) => {
            const queryText = e.target.value.toLowerCase().trim();
            const filtered = allDoctors.filter(docItem => 
                docItem.name.toLowerCase().includes(queryText) || 
                (docItem.email && docItem.email.toLowerCase().includes(queryText))
            );
            renderDoctorsTable(filtered);
        });

        // Unified Handle Registration / Mutation Update Form Pipeline Submissions
        document.getElementById("doctorForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("docName").value.trim();
            const email = document.getElementById("docEmail").value.trim();
            const specialization = document.getElementById("docSpecialization").value.trim();
            const phone = document.getElementById("docPhone").value.trim();
            const status = document.getElementById("docStatus").value;

            let finalDocId = currentEditId;

            // Define targeted data write property values payload package maps 
            const doctorDataPayload = {
                name: name.startsWith("Dr.") ? name : `Dr. ${name}`,
                email: email,
                specialization: specialization,
                phone: phone,
                status: status,
                updatedAt: new Date().toISOString()
            };

            try {
                if (!finalDocId) {
                    // IF CREATE MODE: Fetch collection counter size dynamically for incremental generation mapping
                    const doctorsRef = collection(db, "doctors");
                    const snapshot = await getDocs(doctorsRef);
                    const nextIndex = snapshot.size + 1;
                    const paddedIdNumber = String(nextIndex).padStart(3, '0');
                    
                    const simpleNameToken = name.toLowerCase()
                        .replace(/^dr\.\s*/i, '')
                        .replace(/[^a-z0-9]/g, '')
                        .split(" ")[0];
                    
                    finalDocId = `doctor_${simpleNameToken || "practitioner"}_${paddedIdNumber}`;
                    doctorDataPayload.createdAt = new Date().toISOString();
                }

                // Save or merge updates directly onto Firestore Document Node Reference keys
                await setDoc(doc(db, "doctors", finalDocId), doctorDataPayload, { merge: true });

                window.toggleModal(false); 
                alert(`Successfully processed profile record data context updates under Reference ID: ${finalDocId}`);
            } catch (error) {
                console.error("Firestore Registry write error: ", error);
                alert("Could not update or append profile configuration structures matching inputs: " + error.message);
            }
        });

        // Expose dynamic helper utilities out onto top-level layout frameworks explicitly
        function openAddModal() {
            currentEditId = null;
            document.getElementById("modalTitle").innerHTML = `<i class="fas fa-user-md mr-2"></i>Register New Doctor`;
            document.getElementById("statusFieldContainer").classList.add("hidden");
            document.getElementById("docStatus").value = "Active";
            window.toggleModal(true);
        }

        function openEditModal(doctor) {
            currentEditId = doctor.id;
            document.getElementById("modalTitle").innerHTML = `<i class="fas fa-user-edit mr-2"></i>Edit Doctor Profile`;
            
            // Populate form values mapping indexes directly from data cache nodes
            document.getElementById("docName").value = doctor.name;
            document.getElementById("docEmail").value = doctor.email || "";
            document.getElementById("docSpecialization").value = doctor.specialization || "";
            document.getElementById("docPhone").value = doctor.phone || "";
            document.getElementById("docStatus").value = doctor.status || "Active";
            
            // Show operation status field adjustments layout block exclusively inside Edit modes
            document.getElementById("statusFieldContainer").classList.remove("hidden");
            window.toggleModal(true);
        }

        // Bind helpers onto the window container scope
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
    </script>

    <script>
        // Interactive UI Toggling Wrapper
        function toggleModal(show) {
            const modal = document.getElementById('doctorModal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('doctorForm').reset();
            }
        }
        window.toggleModal = toggleModal;
    </script>
</body>
</html>
