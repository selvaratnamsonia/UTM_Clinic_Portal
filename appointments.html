<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment History - UTM Clinic</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/premium-dialog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #802c44;
            --primary-light: #f4e8ec;
            --primary-hover: #6a2438;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            
            /* Payment Feature Custom Colors */
            --payment-amber: #d97706;
            --payment-amber-light: #fef3c7;
            --payment-amber-hover: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-dark);
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 280px;
            background: var(--white);
            border-right: 1px solid var(--border-color);
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 25px 40px;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(128, 44, 68, 0.3);
        }

        .logo-img { 
            width: 80%; 
            height: 80%; 
            object-fit: contain; 
        }
        
        .logo-text { 
            font-size: 22px; 
            font-weight: 700; 
            color: var(--primary); 
            letter-spacing: -0.5px;
        }

        .nav-links { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            padding: 0 15px; 
            height: 100%;
        }

        .nav-link {
            padding: 12px 18px;
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-link i {
            font-size: 18px;
            width: 24px;
        }

        .nav-link:hover { 
            background: var(--primary-light); 
            color: var(--primary); 
        }
        
        .nav-link.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 12px rgba(128, 44, 68, 0.2);
        }

        /* --- Main Content Section --- */
        .main {
            flex: 1;
            padding: 40px 60px;
            max-width: 1400px;
        }

        header { margin-bottom: 35px; }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); }

        /* --- Navigation Sub-Tabs --- */
        .history-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .tab-btn.active-tab {
            color: var(--white);
            background: var(--primary);
        }

        /* --- Table Filter Controls --- */
        .table-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-controls {
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #fcfcfc;
            outline: none;
            transition: 0.2s;
        }

        .search-wrapper input:focus { border-color: var(--primary); background: #fff; }

        .filter-select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-dark);
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        /* --- Data Presentation Table --- */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead { background: #f8fafc; }

        th {
            text-align: left;
            padding: 16px 25px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 20px 25px;
            border-top: 1px solid #f1f5f9;
            font-size: 15px;
            vertical-align: middle;
        }

        tr:hover { background: #fcfcfc; }

        .doctor-info { font-weight: 600; color: var(--text-dark); }
        .date-cell { color: var(--text-muted); font-size: 14px; }
        .date-cell small { font-size: 12px; color: #94a3b8; }

        /* --- Custom Status Badges --- */
        .badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            text-transform: capitalize;
        }

        .badge.confirmed { background: #dcfce7; color: #15803d; }
        .badge.pending { background: #fef3c7; color: #b45309; }
        .badge.completed { background: #e0f2fe; color: #0369a1; }
        .badge.cancelled { background: #fee2e2; color: #dc2626; }
        .badge.pending-payment-verification { background: #fee2e2; color: #d97706; background-color: #fef3c7; }

        /* --- Action Controls --- */
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon.cancel-btn {
            color: #dc2626 !important;
            border-color: #fee2e2 !important;
            background: #fef2f2 !important;
        }

        .btn-icon.cancel-btn:hover {
             border-color: #dc2626 !important;
             color: #ffffff !important;
             background: #dc2626 !important;
        }

        /* --- Payment Feature Button Layout Style --- */
        .btn-pay-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background-color: var(--payment-amber-light);
            border: 1px solid #fde68a;
            color: var(--payment-amber);
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 4px rgba(217, 119, 6, 0.04);
            text-decoration: none;
        }

        .btn-pay-action:hover {
            background-color: var(--payment-amber);
            border-color: var(--payment-amber);
            color: var(--white);
            box-shadow: 0 4px 6px rgba(217, 119, 6, 0.15);
        }

        .btn-pay-action i {
            font-size: 14px;
        }

        /* --- MC Feature Button Layout Style --- */
        .btn-mc-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #059669;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 2px 4px rgba(5, 150, 105, 0.04);
            text-decoration: none;
        }

        .btn-mc-action:hover {
            background-color: #059669;
            border-color: #059669;
            color: var(--white);
            box-shadow: 0 4px 6px rgba(5, 150, 105, 0.15);
        }

        .btn-mc-action i {
            font-size: 14px;
        }

        .btn-mc-action:disabled {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Container adjustment for layout buttons alignment */
        .action-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .no-action {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }

        .no-action.overdue {
            color: #dc2626;
            font-weight: 600;
            font-style: normal;
        }

        .empty-row-msg {
            text-align: center;
            padding: 40px !important;
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- Layout Responsiveness --- */
        @media (max-width: 1024px) {
            .sidebar { width: 80px; }
            .logo-text, .nav-link span { display: none; }
            .nav-link { justify-content: center; padding: 15px; }
            .main { padding: 30px; }
        }

        @media (max-width: 768px) {
            .table-card { overflow-x: auto; }
            table { min-width: 850px; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo-container">
        <div class="logo-box">
            <img src="images/Clinic-logo.png" alt="UTM Clinic Logo" class="logo-img">
        </div>
        <div class="logo-text">UTM Clinic</div>
    </div>

    <nav class="nav-links">
        <a href="patient_dashboard.html" class="nav-link">
            <i class="fas fa-columns"></i> <span>Dashboard</span>
        </a>
        <a href="appointments.html" class="nav-link active">
            <i class="fas fa-calendar-alt"></i> <span>My Appointments</span>
        </a>
        <a href="book-appointment.html" class="nav-link">
            <i class="fas fa-plus-circle"></i> <span>Book Appointment</span>
        </a>
        <a href="patient-profile.html" class="nav-link">
            <i class="fas fa-user-circle"></i> <span>Profile</span>
        </a>
        <a href="login.html" id="logoutLink" class="nav-link" style="margin-top: auto; color: #ef4444;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </a>
    </nav>
</aside>

<main class="main">
    <header>
        <h1>Appointment History</h1>
        <p class="subtitle">Track and manage your visits to the UTM Health Centre.</p>
    </header>

    <div class="history-tabs">
        <button class="tab-btn active-tab" id="tabUpcoming">📅 Upcoming Appointments</button>
        <button class="tab-btn" id="tabPast">📜 Past Appointments</button>
    </div>

    <div class="table-card">
        <div class="table-controls">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="tableSearch" placeholder="Search by doctor or reason...">
            </div>
            
            <select class="filter-select" id="statusFilter">
                <option value="all">All Statuses</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="pending-payment-verification">Pending Payment Verification</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Doctor</th>
                    <th>Date & Time</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th style="text-align: center; width: 220px;">Action</th>
                </tr>
            </thead>
            <tbody id="appointmentsTableBody">
                <tr>
                    <td colspan="5" class="empty-row-msg">Loading your clinic history data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script type="module">
    // --- Shared Premium Dialog Dynamic Import Engine ---
    import { showConfirm } from "./js/premium-dialog.js";

    import { auth, db } from './js/firebase-config.js';
    import { signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    
    // Import your MC generator function
    import { generateMCPDF } from "./js/mc-generator.js";

    let allAppointments = []; 
    let currentTab = 'upcoming'; 

    // Authenticate account state configuration
    auth.onAuthStateChanged(async (user) => {
        if (!user) { 
            window.location.href = 'login.html'; 
            return; 
        }
        await loadAppointments(user.uid);
    });

    // Query fetching handler
    async function loadAppointments(uid) {
        try {
            const q = query(collection(db, "appointments"), where("userId", "==", uid));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                document.getElementById('appointmentsTableBody').innerHTML = '<tr><td colspan="5" class="empty-row-msg">No appointments found in your account history.</td></tr>';
                allAppointments = [];
                return;
            }
            
            allAppointments = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            applyFilters(); 
            
        } catch (error) {
            console.error("Firestore read error:", error);
            document.getElementById('appointmentsTableBody').innerHTML = '<tr><td colspan="5" class="empty-row-msg" style="color:red;">Error connecting to medical database. Please refresh and try again.</td></tr>';
        }
    }

    // Format doctor name display
    function getDoctorDisplayName(appointment) {
        if (appointment.doctorName && appointment.doctorName !== "") {
            return `Dr. ${appointment.doctorName}`;
        }
        if (appointment.doctorId && appointment.doctorId !== "") {
            return "Doctor Assigned (Name Pending)";
        }
        return "Awaiting Doctor Assignment";
    }

    // Helper to accurately parse "YYYY-MM-DD" and "HH:MM AM/PM" into a comparable Date Object
    function parseAppointmentDateTime(dateStr, timeStr) {
        if (!dateStr) return new Date(0);
        if (!timeStr || timeStr === "Time TBD") return new Date(`${dateStr}T00:00:00`);

        const [time, modifier] = timeStr.split(' ');
        let [hours, minutes] = time.split(':');
        hours = parseInt(hours, 10);

        if (modifier === 'PM' && hours < 12) hours += 12;
        if (modifier === 'AM' && hours === 12) hours = 0;

        const formattedHours = String(hours).padStart(2, '0');
        const formattedMinutes = String(minutes).padStart(2, '0');

        return new Date(`${dateStr}T${formattedHours}:${formattedMinutes}:00`);
    }

    // View interface rendering logic
    async function renderTable(appointmentsList) {
        const container = document.getElementById('appointmentsTableBody');
        if (!container) return;

        if (appointmentsList.length === 0) {
            container.innerHTML = `<tr><td colspan="5" class="empty-row-msg">No ${currentTab} appointments found matching your criteria.</td></tr>`;
            return;
        }

        let html = '';
        const now = new Date();
        
        for (const item of appointmentsList) {
            const doctorDisplay = getDoctorDisplayName(item);
            const timeStr = item.time || "Time TBD";
            const reasonStr = item.reason || "General Consultation";
            const currentStatus = item.status ? item.status.toLowerCase() : 'pending';

            const aptDateTime = parseAppointmentDateTime(item.date, item.time);
            const isOverdue = (aptDateTime < now) && (currentStatus === 'pending' || currentStatus === 'confirmed');

            const canCancel = (currentStatus === 'pending' || currentStatus === 'confirmed') && !isOverdue;
            const isCancelled = currentStatus === 'cancelled';
            const isCompleted = currentStatus === 'completed';
            const isPendingVerification = currentStatus === 'pending-payment-verification';

            let actionHtml = '';
            if (isOverdue) {
                actionHtml = '<span class="no-action overdue">Overdue</span>';
            } else if (canCancel) {
                actionHtml = `<button class="btn-icon cancel-btn" title="Cancel Appointment" data-id="${item.id}">
                                <i class="fas fa-trash-alt"></i>
                              </button>`;
            } else if (isCancelled) {
                actionHtml = '<span class="no-action">Cancelled</span>';
            } else if (isPendingVerification) {
                actionHtml = `
                    <div class="action-container">
                        <button class="btn-mc-action download-mc-btn" title="Download Medical Certificate" data-id="${item.id}">
                            <i class="fas fa-file-download"></i> Download MC
                        </button>
                        <span class="no-action" style="font-weight: 600; color: var(--payment-amber);">Verifying Payment...</span>
                    </div>`;
            } else if (isCompleted) {
                actionHtml = `
                    <div class="action-container">
                        <button class="btn-mc-action download-mc-btn" title="Download Medical Certificate" data-id="${item.id}">
                            <i class="fas fa-file-download"></i> Download MC
                        </button>
                        <button class="btn-pay-action" title="Pay Fee" onclick="window.location.href='patient-pay-page.html?aptId=${item.id}'">
                            <i class="fas fa-credit-card"></i> Pay Fee
                        </button>
                    </div>`;
            } else {
                actionHtml = '<span class="no-action">No action</span>';
            }

            // User interface adjustments for status code labels
            let displayStatus = currentStatus;
            if (currentStatus === 'pending-payment-verification') {
                displayStatus = 'Pending Verification';
            }

            html += `
                <tr>
                    <td class="doctor-info">${doctorDisplay}</td>
                    <td class="date-cell">${item.date} <br> <small>${timeStr}</small></td>
                    <td>${escapeHtml(reasonStr)}</td>
                    <td><span class="badge ${currentStatus}">${displayStatus}</span></td>
                    <td align="center">${actionHtml}</td>
                </tr>
            `;
        }
        
        container.innerHTML = html;
        bindTableActionListeners();
    }
    
    function bindTableActionListeners() {
        // Cancel Action Button Interception
        document.querySelectorAll('.cancel-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const appointmentId = btn.getAttribute('data-id');
                await cancelAppointment(appointmentId);
            });
        });

        // Automatic PDF Compilation & Save Interception
        document.querySelectorAll('.download-mc-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const appointmentId = btn.getAttribute('data-id');
                
                // Show intuitive UI loading state indicator
                const originalHtml = btn.innerHTML;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Downloading...`;
                btn.disabled = true;

                await handleMcAutoDownload(appointmentId);

                // Restore component design values back to initial state
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            });
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function cancelAppointment(appointmentId) {
        const confirmCancel = await showConfirm(
            "Cancel Appointment",
            "Are you sure you want to cancel this scheduled clinic appointment?",
            "fa-exclamation-triangle"
        );
        if (!confirmCancel) return;

        try {
            const appointmentDocRef = doc(db, "appointments", appointmentId);
            await updateDoc(appointmentDocRef, { status: "cancelled" });
            
            await showConfirm("Success", "Your appointment has been successfully cancelled.", "fa-check-circle");
            await loadAppointments(auth.currentUser.uid);
        } catch (error) {
            console.error("Cancellation error:", error);
            await showConfirm("Failed", "Failed to cancel appointment: " + error.message, "fa-times-circle");
        }
    }

    // Pipeline orchestrator fetching database elements to populate your generator interface
    async function handleMcAutoDownload(appointmentId) {
        try {
            // 1. Fetch targeted appointment metrics
            const appointmentDocRef = doc(db, "appointments", appointmentId);
            const aptSnap = await getDoc(appointmentDocRef);

            if (!aptSnap.exists()) {
                alert("Targeted clinic record tracking values missing.");
                return;
            }
            const aptData = aptSnap.data();

            // 2. Query structural information out of profile scope mapping parameters
            const userDocRef = doc(db, "users", aptData.userId);
            const userSnap = await getDoc(userDocRef);
            const userData = userSnap.exists() ? userSnap.data() : {};

            // 3. Reorganize schema keys onto matching layouts inside mc-generator parameters
            const mcData = {
                patientName: userData.name || aptData.patientName || "UTM Patient",
                matricNumber: userData.matricNumber || "NOT RECORDED",
                faculty: userData.faculty || "General",
                diagnosisDate: aptData.date, 
                mcDays: aptData.mcDays || 1, 
                doctorName: aptData.doctorName || "Duty Doctor",
                doctorSpecialization: aptData.doctorSpecialization || "Pegawai Perubatan",
                doctorLicenseNumber: aptData.doctorLicenseNumber || "MMC Registered",
                doctorSignatureUrl: aptData.doctorSignatureUrl || "" 
            };

            // 4. Pass constructed schema maps out directly into the asynchronous processing stream
            await generateMCPDF(mcData);

        } catch (error) {
            console.error("Critical stream termination on MC engine processing:", error);
            alert("An issue occurred structuralizing the PDF file. Please try downloading again.");
        }
    }

    // Combined filter logic
    function applyFilters() {
        const searchInput = document.getElementById('tableSearch');
        const statusFilter = document.getElementById('statusFilter');
        
        const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const filterValue = statusFilter ? statusFilter.value : 'all';
        
        const now = new Date();

        let timelineFiltered = allAppointments.filter(item => {
            const status = item.status ? item.status.toLowerCase() : 'pending';
            const aptDateTime = parseAppointmentDateTime(item.date, item.time);
            
            if (currentTab === 'upcoming') {
                // If it requires payment confirmation, it is no longer an upcoming visit
                return (aptDateTime >= now) && (status !== 'cancelled' && status !== 'completed' && status !== 'pending-payment-verification');
            } else {
                // Keep completed items or items waiting for payment confirmation in the Past history tab
                return (aptDateTime < now) || (status === 'cancelled' || status === 'completed' || status === 'pending-payment-verification');
            }
        });
        
        // Sort timeline lists
        if (currentTab === 'upcoming') {
            timelineFiltered.sort((a, b) => parseAppointmentDateTime(a.date, a.time) - parseAppointmentDateTime(b.date, b.time));
        } else {
            timelineFiltered.sort((a, b) => parseAppointmentDateTime(b.date, b.time) - parseAppointmentDateTime(a.date, a.time));
        }
        
        // Apply search and status filters
        const finalFiltered = timelineFiltered.filter(item => {
            const doctorName = (item.doctorName || '').toLowerCase();
            const reason = (item.reason || '').toLowerCase();
            const matchesKeyword = doctorName.includes(keyword) || reason.includes(keyword);
            
            const itemStatus = item.status ? item.status.toLowerCase() : 'pending';
            const matchesStatus = (filterValue === 'all') || (itemStatus === filterValue);
            
            return matchesKeyword && matchesStatus;
        });

        renderTable(finalFiltered);
    }

    // Setup DOM listeners
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('tableSearch');
        const statusFilter = document.getElementById('statusFilter');
        const tabUpcoming = document.getElementById('tabUpcoming');
        const tabPast = document.getElementById('tabPast');

        if (searchInput) searchInput.addEventListener('input', applyFilters);
        if (statusFilter) statusFilter.addEventListener('change', applyFilters);

        if (tabUpcoming && tabPast) {
            tabUpcoming.addEventListener('click', () => {
                currentTab = 'upcoming';
                tabUpcoming.classList.add('active-tab');
                tabPast.classList.remove('active-tab');
                applyFilters();
            });

            tabPast.addEventListener('click', () => {
                currentTab = 'past';
                tabPast.classList.add('active-tab');
                tabUpcoming.classList.remove('active-tab');
                applyFilters();
            });
        }
    });

    // Premium Interactive Session Logout Handler
    const logoutLink = document.getElementById('logoutLink');
    if (logoutLink) {
        logoutLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const confirmLogout = await showConfirm(
                "Account Logout",
                "Are you sure you want to log out of your UTM Clinic patient panel?",
                "fa-sign-out-alt"
            );
            
            if (confirmLogout) {
                await signOut(auth);
                window.location.href = 'login.html';
            }
        });
    }
</script>
</body>
</html>
