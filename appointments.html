<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Appointments - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-2">Appointment History</h1>
        <p class="text-gray-500 mb-6">View all your clinic visits</p>
        <div id="appointmentsList" class="space-y-4"></div>
        <a href="patient_dashboard.html" class="inline-block mt-4 text-primary">&larr; Back to Dashboard</a>
    </div>
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const q = query(collection(db, "appointments"), where("userId", "==", user.uid), orderBy("date", "desc"));
            const snap = await getDocs(q);
            const container = document.getElementById('appointmentsList');
            if (snap.empty) {
                container.innerHTML = '<div class="bg-white p-6 rounded shadow text-center">No appointments found.</div>';
                return;
            }
            let html = '';
            snap.forEach(doc => {
                const data = doc.data();
                html += `
                    <div class="bg-white p-4 rounded shadow flex justify-between items-center">
                        <div>
                            <p class="font-bold">${data.date}</p>
                            <p class="text-gray-600">Reason: ${data.reason}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs ${data.status === 'confirmed' ? 'bg-green-100 text-green-700' : (data.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100')}">${data.status}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        });
    </script>
</body>
</html>
