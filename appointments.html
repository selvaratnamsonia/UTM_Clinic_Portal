<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment History - UTM Clinic</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/premium-dialog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #802c44;
            --primary-light: #f4e8ec;
            --primary-hover: #6a2438;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: var(--bg-body);
            color: var(--text-dark);
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 280px;
            background: var(--white);
            border-right: 1px solid var(--border-color);
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 25px 40px;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img { width: 80%; height: 80%; object-fit: contain; }
        .logo-text { font-size: 22px; font-weight: 700; color: var(--primary); }

        .nav-links { display: flex; flex-direction: column; gap: 5px; padding: 0 15px; }

        .nav-link {
            padding: 12px 18px;
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-link:hover { background: var(--primary-light); color: var(--primary); }
        .nav-link.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

        /* --- Main Content Section --- */
        .main {
            flex: 1;
            padding: 40px 60px;
            max-width: 1400px;
        }

        header { margin-bottom: 35px; }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); }

        /* --- Navigation Sub-Tabs --- */
        .history-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .tab-btn.active-tab {
            color: var(--white);
            background: var(--primary);
        }

        /* --- Table Filter Controls --- */
        .table-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-controls {
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #fcfcfc;
            outline: none;
            transition: 0.2s;
        }

        .search-wrapper input:focus { border-color: var(--primary); background: #fff; }

        .filter-select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-dark);
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        /* --- Data Presentation Table --- */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead { background: #f8fafc; }

        th {
            text-align: left;
            padding: 16px 25px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 20px 25px;
            border-top: 1px solid #f1f5f9;
            font-size: 15px;
            vertical-align: middle;
        }

        tr:hover { background: #fcfcfc; }

        .doctor-info { font-weight: 600; color: var(--text-dark); }
        .date-cell { color: var(--text-muted); font-size: 14px; }
        .date-cell small { font-size: 12px; color: #94a3b8; }

        /* --- Custom Status Badges --- */
        .badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            text-transform: capitalize;
        }

        .badge.confirmed { background: #dcfce7; color: #15803d; }
        .badge.pending { background: #fef3c7; color: #b45309; }
        .badge.completed { background: #e0f2fe; color: #0369a1; }
        .badge.cancelled { background: #fee2e2; color: #dc2626; }

        /* --- Action Controls --- */
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon.cancel-btn {
            color: #dc2626 !important;
            border-color: #fee2e2 !important;
            background: #fef2f2 !important;
        }

        .btn-icon.cancel-btn:hover {
             border-color: #dc2626 !important;
             color: #ffffff !important;
             background: #dc2626 !important;
        }

        .no-action {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
        }

        .no-action.overdue {
            color: #dc2626;
            font-weight: 600;
            font-style: normal;
        }

        .empty-row-msg {
            text-align: center;
            padding: 40px !important;
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- Layout Responsiveness --- */
        @media (max-width: 1024px) {
            .sidebar { width: 80px; }
            .logo-text, .nav-link span { display: none; }
            .main { padding: 30px; }
        }

        @media (max-width: 768px) {
            .table-card { overflow-x: auto; }
            table { min-width: 800px; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo-container">
        <div class="logo-box">
            <img src="images/Clinic-logo.png" alt="Logo" class="logo-img">
        </div>
        <div class="logo-text">UTM Clinic</div>
    </div>

    <nav class="nav-links">
        <a href="patient_dashboard.html" class="nav-link">
            <i class="fas fa-columns"></i> <span>Dashboard</span>
        </a>
        <a href="appointments.html" class="nav-link active">
            <i class="fas fa-calendar-alt"></i> <span>My Appointments</span>
        </a>
        <a href="book-appointment.html" class="nav-link">
            <i class="fas fa-plus-circle"></i> <span>Book Appointment</span>
        </a>
        <a href="patient-profile.html" class="nav-link">
            <i class="fas fa-user-circle"></i> <span>Profile</span>
        </a>
        <a href="#" id="logoutLink" class="nav-link" style="margin-top: auto; color: #ef4444;">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </a>
    </nav>
</aside>

<main class="main">
    <header>
        <h1>Appointment History</h1>
        <p class="subtitle">Track and manage your visits to the UTM Health Centre.</p>
    </header>

    <div class="history-tabs">
        <button class="tab-btn active-tab" id="tabUpcoming">📅 Upcoming Appointments</button>
        <button class="tab-btn" id="tabPast">📜 Past Appointments</button>
    </div>

    <div class="table-card">
        <div class="table-controls">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="tableSearch" placeholder="Search by doctor or reason...">
            </div>
            
            <select class="filter-select" id="statusFilter">
                <option value="all">All Statuses</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Doctor</th>
                    <th>Date & Time</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th style="text-align: center; width: 140px;">Action</th>
                </tr>
            </thead>
            <tbody id="appointmentsTableBody">
                <tr>
                    <td colspan="5" class="empty-row-msg">Loading your clinic history data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script type="module">
    // --- Shared Premium Dialog Dynamic Import Engine ---
    import { showConfirm } from "./js/premium-dialog.js";

    import { auth, db } from './js/firebase-config.js';
    import { signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    let allAppointments = []; 
    let currentTab = 'upcoming'; 

    // Authenticate account state configuration
    auth.onAuthStateChanged(async (user) => {
        if (!user) { 
            window.location.href = 'login.html'; 
            return; 
        }
        await loadAppointments(user.uid);
    });

    // Query fetching handler
    async function loadAppointments(uid) {
        try {
            const q = query(collection(db, "appointments"), where("userId", "==", uid));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                document.getElementById('appointmentsTableBody').innerHTML = '<tr><td colspan="5" class="empty-row-msg">No appointments found in your account history.</td></tr>';
                allAppointments = [];
                return;
            }
            
            allAppointments = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            applyFilters(); 
            
        } catch (error) {
            console.error("Firestore read error:", error);
            document.getElementById('appointmentsTableBody').innerHTML = '<tr><td colspan="5" class="empty-row-msg" style="color:red;">Error connecting to medical database. Please refresh and try again.</td></tr>';
        }
    }

    // Format doctor name display
    function getDoctorDisplayName(appointment) {
        if (appointment.doctorName && appointment.doctorName !== "") {
            return `Dr. ${appointment.doctorName}`;
        }
        if (appointment.doctorId && appointment.doctorId !== "") {
            return "Doctor Assigned (Name Pending)";
        }
        return "Awaiting Doctor Assignment";
    }

    // View interface rendering logic
    async function renderTable(appointmentsList) {
        const container = document.getElementById('appointmentsTableBody');
        if (!container) return;

        if (appointmentsList.length === 0) {
            container.innerHTML = `<tr><td colspan="5" class="empty-row-msg">No ${currentTab} appointments found matching your criteria.</td></tr>`;
            return;
        }

        let html = '';
        
        // Use for...of loop to support sequential asynchronous verification safely
        for (const item of appointmentsList) {
            const doctorDisplay = getDoctorDisplayName(item);
            const timeStr = item.time || "Time TBD";
            const reasonStr = item.reason || "General Consultation";
            const currentStatus = item.status ? item.status.toLowerCase() : 'pending';

            const todayStr = new Date().toISOString().split("T")[0];
            // An appointment is overdue if its date is older than today, and its status is still pending/confirmed
            const isOverdue = (item.date < todayStr) && (currentStatus === 'pending' || currentStatus === 'confirmed');

            const canCancel = (currentStatus === 'pending' || currentStatus === 'confirmed') && !isOverdue;
            const isCancelled = currentStatus === 'cancelled';
            const isCompleted = currentStatus === 'completed';

            let hasMC = false;
            let diagnosisId = "";

            // Safely verify matching diagnosis subcollections inside the map engine loop
            if (isCompleted) {
                try {
                    const diagnosisQuery = query(collection(db, "diagnosis"), where("appointmentId", "==", item.id));
                    const diagnosisSnap = await getDocs(diagnosisQuery);
                    if (!diagnosisSnap.empty) {
                        diagnosisId = diagnosisSnap.docs[0].id;
                        const diagnosisData = diagnosisSnap.docs[0].data();
                        hasMC = diagnosisData.mcIssued === true;
                    }
                } catch(e) { 
                    console.error("Diagnosis fetch failure:", e); 
                }
            }

            let actionHtml = '';
            if (isOverdue) {
                actionHtml = '<span class="no-action overdue">Overdue</span>';
            } else if (canCancel) {
                actionHtml = `<button class="btn-icon cancel-btn" title="Cancel Appointment" data-id="${item.id}">
                                <i class="fas fa-trash-alt"></i>
                              </button>`;
            } else if (isCancelled) {
                actionHtml = '<span class="no-action">Cancelled</span>';
            } else if (isCompleted && hasMC) {
                actionHtml = `<button class="btn-icon view-mc-btn" title="View Medical Certificate" data-diagnosis-id="${diagnosisId}" style="background: #e0f2fe; color: #0284c7;">
                                <i class="fas fa-file-medical"></i>
                              </button>`;
            } else if (isCompleted) {
                actionHtml = '<span class="no-action">Completed</span>';
            } else {
                actionHtml = '<span class="no-action">No action</span>';
            }

            html += `
                <tr>
                    <td class="doctor-info">${doctorDisplay}</td>
                    <td class="date-cell">${item.date} <br> <small>${timeStr}</small></td>
                    <td>${escapeHtml(reasonStr)}</td>
                    <td><span class="badge ${currentStatus}">${currentStatus}</span></td>
                    <td align="center">${actionHtml}</td>
                </tr>
            `;
        }
        
        container.innerHTML = html;
        
        // Attach interactive layout navigation event triggers
        document.querySelectorAll('.view-mc-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const diagnosisId = btn.getAttribute('data-diagnosis-id');
                window.location.href = `view-mc.html?diagnosisId=${diagnosisId}`;
            });
        });

        document.querySelectorAll('.cancel-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const appointmentId = btn.getAttribute('data-id');
                await cancelAppointment(appointmentId);
            });
        });
    }
    
    // Simple escape to prevent XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Cancel appointment in Firestore with Premium Dialog Integration
    async function cancelAppointment(appointmentId) {
        const confirmCancel = await showConfirm(
            "Cancel Appointment",
            "Are you sure you want to cancel this scheduled clinic appointment?",
            "fa-exclamation-triangle"
        );
        if (!confirmCancel) return;

        try {
            const appointmentDocRef = doc(db, "appointments", appointmentId);
            await updateDoc(appointmentDocRef, { status: "cancelled" });
            
            await showConfirm("Success", "Your appointment has been successfully cancelled.", "fa-check-circle");
            await loadAppointments(auth.currentUser.uid);
        } catch (error) {
            console.error("Cancellation error:", error);
            await showConfirm("Failed", "Failed to cancel appointment: " + error.message, "fa-times-circle");
        }
    }

    // Combined filter logic
    function applyFilters() {
        const searchInput = document.getElementById('tableSearch');
        const statusFilter = document.getElementById('statusFilter');
        
        const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const filterValue = statusFilter ? statusFilter.value : 'all';
        
        const todayStr = new Date().toISOString().split("T")[0];

        // First, separate upcoming vs past based on date string comparison
        let timelineFiltered = allAppointments.filter(item => {
            const status = item.status ? item.status.toLowerCase() : 'pending';
            
            if (currentTab === 'upcoming') {
                return (item.date >= todayStr) && (status !== 'cancelled' && status !== 'completed');
            } else {
                return (item.date < todayStr) || (status === 'cancelled' || status === 'completed');
            }
        });
        
        // Sort timeline lists
        if (currentTab === 'upcoming') {
            timelineFiltered.sort((a, b) => new Date(a.date) - new Date(b.date));
        } else {
            timelineFiltered.sort((a, b) => new Date(b.date) - new Date(a.date));
        }
        
        // Apply search and status filters
        const finalFiltered = timelineFiltered.filter(item => {
            const doctorName = (item.doctorName || '').toLowerCase();
            const reason = (item.reason || '').toLowerCase();
            const matchesKeyword = doctorName.includes(keyword) || reason.includes(keyword);
            
            const itemStatus = item.status ? item.status.toLowerCase() : 'pending';
            const matchesStatus = (filterValue === 'all') || (itemStatus === filterValue);
            
            return matchesKeyword && matchesStatus;
        });

        renderTable(finalFiltered);
    }

    // Setup DOM listeners
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('tableSearch');
        const statusFilter = document.getElementById('statusFilter');
        const tabUpcoming = document.getElementById('tabUpcoming');
        const tabPast = document.getElementById('tabPast');

        if (searchInput) searchInput.addEventListener('input', applyFilters);
        if (statusFilter) statusFilter.addEventListener('change', applyFilters);

        if (tabUpcoming && tabPast) {
            tabUpcoming.addEventListener('click', () => {
                currentTab = 'upcoming';
                tabUpcoming.classList.add('active-tab');
                tabPast.classList.remove('active-tab');
                applyFilters();
            });

            tabPast.addEventListener('click', () => {
                currentTab = 'past';
                tabPast.classList.add('active-tab');
                tabUpcoming.classList.remove('active-tab');
                applyFilters();
            });
        }
    });

    // Premium Interactive Session Logout Handler
    const logoutLink = document.getElementById('logoutLink');
    if (logoutLink) {
        logoutLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const confirmLogout = await showConfirm(
                "Account Logout",
                "Are you sure you want to log out of your UTM Clinic patient panel?",
                "fa-sign-out-alt"
            );
            
            if (confirmLogout) {
                await signOut(auth);
                window.location.href = 'login.html';
            }
        });
    }
</script>
</body>
</html>
