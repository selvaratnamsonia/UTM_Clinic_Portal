<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMB Clicks | FPX Payment Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* All styles remain exactly as your original – only functional JavaScript changed */
        :root { --cimb-red: #7c1c1c; --bg-body: #1e1e1e; --card-bg: #ffffff; --text-dark: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius-lg: 16px; --radius-md: 8px; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: #111; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--cimb-red); }
        .logo { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .logo span { color: #ff3333; }
        .fpx-indicator { background: #009688; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .bank-card { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: var(--radius-lg); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); padding: 35px; border-top: 5px solid var(--cimb-red); }
        h2 { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 25px; color: #334155; letter-spacing: 0.5px; }
        .invoice-box { background: #fff5f5; border: 1px solid #feb2b2; padding: 18px; border-radius: var(--radius-md); margin-bottom: 24px; font-size: 14px; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .invoice-row:last-child { margin-bottom: 0; padding-top: 10px; border-top: 1px dashed #fca5a5; font-weight: 700; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .input-wrapper { position: relative; display: flex; }
        .input-field { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; outline: none; background: #f8fafc; color: var(--text-dark); font-weight: 500; transition: var(--transition); }
        .input-field:focus { border-color: var(--cimb-red); background: #fff; box-shadow: 0 0 0 3px rgba(124, 28, 28, 0.1); }
        .input-field[readonly] { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        .btn-tac { background: #334155; color: #fff; border: none; padding: 0 18px; border-radius: 0 var(--radius-md) var(--radius-md) 0; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: -1px; transition: var(--transition); }
        .btn-tac:hover { background: #1e293b; }
        .btn-submit { width: 100%; background: var(--cimb-red); color: #fff; border: none; padding: 14px; border-radius: var(--radius-md); font-size: 15px; font-weight: 700; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px rgba(124, 28, 28, 0.2); }
        .btn-submit:hover { background: #611414; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124, 28, 28, 0.3); }
        .cancel-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: var(--transition); }
        .cancel-link:hover { color: var(--cimb-red); text-decoration: underline; }
        footer { background: #111; color: #475569; text-align: center; padding: 15px; font-size: 11px; border-top: 1px solid #222; }
        .premium-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: var(--transition); z-index: 9999; padding: 20px; }
        .premium-modal-overlay.active { opacity: 1; visibility: visible; }
        .premium-modal-card { background: #ffffff; border-radius: 24px; padding: 32px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4); transform: scale(0.92) translateY(15px); transition: var(--transition); border: 1px solid rgba(226, 232, 240, 0.8); }
        .premium-modal-overlay.active .premium-modal-card { transform: scale(1) translateY(0); }
        .premium-modal-icon { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 20px auto; }
        .icon-error { background: #fef2f2; color: #ef4444; }
        .icon-info { background: #f0fdf4; color: #16a34a; }
        .icon-warn { background: #fffbeb; color: #d97706; }
        .premium-modal-title { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 12px; line-height: 1.3; }
        .premium-modal-msg { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
        .premium-modal-actions { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { flex: 1; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; outline: none; }
        .modal-btn-secondary { background: #f1f5f9; color: #475569; }
        .modal-btn-secondary:hover { background: #e2e8f0; color: #1e293b; }
        .modal-btn-primary { background: var(--cimb-red); color: #ffffff; box-shadow: 0 4px 12px rgba(124, 28, 28, 0.15); }
        .modal-btn-primary:hover { background: #611414; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124, 28, 28, 0.25); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">CIMB<span>Clicks</span></div>
    <div class="fpx-indicator">FPX</div>
</nav>

<div class="container">
    <div class="bank-card">
        <h2>FPX Secure Payment Transfer</h2>
        
        <div class="invoice-box">
            <div class="invoice-row">
                <span style="color: var(--text-muted);">Merchant:</span>
                <strong>UTM Medical Clinic Portal</strong>
            </div>
            <div class="invoice-row">
                <span style="color: var(--text-muted);">Reference ID:</span>
                <span id="referenceIdDisplay">CIMB-APPOINT_</span>
            </div>
            <div class="invoice-row">
                <span style="color: var(--text-muted);">Amount Due:</span>
                <strong style="color: #c53030;" id="amountDisplay">RM 0.00</strong>
            </div>
        </div>

        <div class="form-group">
            <label>Clicks User ID</label>
            <input type="text" class="input-field" value="utm_student2026" readonly>
        </div>

        <div class="form-group">
            <label>Secure TAC Token</label>
            <div class="input-wrapper">
                <input type="text" id="tacInputField" class="input-field" style="border-radius: 8px 0 0 8px;" placeholder="Enter 6-digit TAC">
                <button type="button" class="btn-tac" id="requestTacBtn">Request TAC via SMS</button>
            </div>
        </div>

        <button type="button" class="btn-submit" id="confirmPaymentBtn">
            Proceed Secure Payment
        </button>

        <a href="appointments.html" class="cancel-link">Cancel and Return to Clinic</a>
    </div>
</div>

<div class="premium-modal-overlay" id="premiumDialogOverlay">
    <div class="premium-modal-card">
        <div class="premium-modal-icon" id="premiumDialogIconBox">
            <i id="premiumDialogIcon" class="fas fa-shield-alt"></i>
        </div>
        <h3 class="premium-modal-title" id="premiumDialogTitle">Notification</h3>
        <p class="premium-modal-msg" id="premiumDialogMessage">Dialog content message string details.</p>
        <div class="premium-modal-actions" id="premiumDialogActions">
            <button class="modal-btn modal-btn-secondary" id="premiumModalCancelBtn">Cancel</button>
            <button class="modal-btn modal-btn-primary" id="premiumModalConfirmBtn">OK</button>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 CIMB Bank Berhad (13491-P). All Rights Reserved.
</footer>

<script type="module">
    // ==================================================================
    // 1. Import Firebase modules (add setDoc, updateDoc, getDoc, etc.)
    // ==================================================================
    import { db } from './js/firebase-config.js';
    import { 
        doc, 
        updateDoc, 
        setDoc,       // used to create document with custom ID
        getDoc,
        collection
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // ==================================================================
    // 2. Premium custom modal (promisified) – same as original but polished
    // ==================================================================
    function triggerPremiumDialog({ title, message, iconMode = "info", showCancel = false, confirmText = "OK" }) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('premiumDialogOverlay');
            const titleEl = document.getElementById('premiumDialogTitle');
            const messageEl = document.getElementById('premiumDialogMessage');
            const iconBox = document.getElementById('premiumDialogIconBox');
            const iconEl = document.getElementById('premiumDialogIcon');
            const cancelBtn = document.getElementById('premiumModalCancelBtn');
            const confirmBtn = document.getElementById('premiumModalConfirmBtn');

            titleEl.innerText = title;
            messageEl.innerHTML = message;
            confirmBtn.innerText = confirmText;

            // Reset icon box classes
            iconBox.className = "premium-modal-icon";
            if (iconMode === "error") {
                iconBox.classList.add('icon-error');
                iconEl.className = "fas fa-exclamation-triangle";
            } else if (iconMode === "warn") {
                iconBox.classList.add('icon-warn');
                iconEl.className = "fas fa-university";
            } else {
                iconBox.classList.add('icon-info');
                iconEl.className = "fas fa-check-circle";
            }

            cancelBtn.style.display = showCancel ? "inline-block" : "none";

            overlay.classList.add('active');

            const handleAction = (statusValue) => {
                overlay.classList.remove('active');
                cleanup();
                resolve(statusValue);
            };

            const clickConfirm = () => handleAction(true);
            const clickCancel = () => handleAction(false);

            function cleanup() {
                confirmBtn.removeEventListener('click', clickConfirm);
                cancelBtn.removeEventListener('click', clickCancel);
            }

            confirmBtn.addEventListener('click', clickConfirm);
            cancelBtn.addEventListener('click', clickCancel);
        });
    }

    // ==================================================================
    // 3. Sequential payment ID generator (Pay_001, Pay_002, …)
    // ==================================================================
    async function getNextPaymentId() {
        const counterRef = doc(db, "counters", "payments");
        let counterSnap = await getDoc(counterRef);
        let nextNum;
        if (!counterSnap.exists()) {
            // First payment ever – initialise counter
            await setDoc(counterRef, { nextId: 1 });
            nextNum = 1;
        } else {
            nextNum = counterSnap.data().nextId;
            // Increment for the next payment
            await updateDoc(counterRef, { nextId: nextNum + 1 });
        }
        const padded = nextNum.toString().padStart(3, '0');
        return `Pay_${padded}`;
    }

    // ==================================================================
    // 4. Parse URL parameters (appointment ID and amount)
    // ==================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const aptId = urlParams.get('aptId') || "";
    const rawAmount = urlParams.get('amount') || "0.00";
    const parsedAmount = parseFloat(rawAmount);

    document.getElementById('amountDisplay').innerText = `RM ${parsedAmount.toFixed(2)}`;
    document.getElementById('referenceIdDisplay').innerText = `CIMB-APPOINT_${aptId.substring(0,6).toUpperCase()}`;

    let nativeGeneratedTac = "";

    // ==================================================================
    // 5. Simulate TAC generation (mock SMS)
    // ==================================================================
    document.getElementById('requestTacBtn').addEventListener('click', () => {
        nativeGeneratedTac = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('tacInputField').value = nativeGeneratedTac;
        // Optionally show a modal info message – but not required
    });

    // ==================================================================
    // 6. Payment confirmation logic – creates payment with custom ID
    // ==================================================================
    document.getElementById('confirmPaymentBtn').addEventListener('click', async () => {
        const enteredTac = document.getElementById('tacInputField').value.trim();
        
        // Validate TAC
        if (!enteredTac || enteredTac !== nativeGeneratedTac) {
            await triggerPremiumDialog({
                title: "Authentication Error",
                message: "Invalid secure TAC token verification payload code.",
                iconMode: "error",
                showCancel: false,
                confirmText: "Try Again"
            });
            return;
        }

        // Ask for confirmation
        const confirmTx = await triggerPremiumDialog({
            title: "Authorize Transfer",
            message: "Authorise immediate debit from your CIMB checking account?",
            iconMode: "warn",
            showCancel: true,
            confirmText: "Yes, Authorise"
        });
        if (!confirmTx) return;

        // Disable button to prevent double submission
        const payBtn = document.getElementById('confirmPaymentBtn');
        payBtn.disabled = true;
        payBtn.innerText = "Processing...";

        try {
            // Fetch appointment details to get patient name and matric
            const aptRef = doc(db, "appointments", aptId);
            const aptSnap = await getDoc(aptRef);
            let patientName = "SIA JUN YU";
            let matricNo = "A24DW0420";

            if (aptSnap.exists()) {
                const data = aptSnap.data();
                patientName = data.patientName || patientName;
                matricNo = data.matricNo || data.matricNumber || matricNo;
            }

            // Build itemised list (fallback to standard fee)
            const items = [{
                itemName: "Standard Outpatient Service Fee",
                unitCost: parsedAmount,
                quantity: 1,
                subtotal: parsedAmount
            }];

            // 🔑 Generate sequential payment ID (e.g., Pay_001)
            const paymentId = await getNextPaymentId();

            // Save payment document using setDoc with custom ID (instead of addDoc)
            await setDoc(doc(db, "payments", paymentId), {
                appointmentId: aptId,
                studentName: patientName,
                studentId: matricNo,
                amount: parsedAmount,
                items: items,
                paymentChannel: "FPX_CIMB",
                status: "pending",
                transactionReference: `FPX-CIMB-${Math.random().toString(36).substr(2, 9).toUpperCase()}`,
                createdAt: new Date()
            });

            // Update appointment status to pending payment verification
            await updateDoc(aptRef, {
                status: "pending-payment-verification",
                paymentStatus: "pending"
            });

            // Show success modal
            await triggerPremiumDialog({
                title: "CIMB Clicks FPX Authorization Logged!",
                message: "Your payment reference transfer has been sent to clinic staff for verification review.",
                iconMode: "info",
                showCancel: false,
                confirmText: "Return to Dashboard"
            });

            // Redirect to appointments page
            window.location.href = "appointments.html";
        } catch (e) {
            console.error("Payment error:", e);
            await triggerPremiumDialog({
                title: "System Exception Error",
                message: "Failed executing Firestore database update task synchronisation.",
                iconMode: "error",
                showCancel: false,
                confirmText: "Close"
            });
            payBtn.disabled = false;
            payBtn.innerText = "Proceed Secure Payment";
        }
    });
</script>
</body>
</html>
