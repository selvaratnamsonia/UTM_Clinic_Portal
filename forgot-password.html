<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - UTM Clinic Portal</title>
    <style>
        /* ... (Your existing styles remain exactly as they are) ... */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background-color: #f8f9fa; }
        .form-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; background-color: #ffffff; }
        .form-box { width: 100%; max-width: 400px; }
        .utm-logo { height: 80px; width: auto; margin: 0 auto 20px; display: block; }
        h2 { text-align: center; color: #333; font-size: 26px; margin-bottom: 10px; }
        .instructions { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; font-size: 14px; outline-color: #802c44; }
        .btn-submit { width: 100%; padding: 14px; background-color: #802c44; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #612134; }
        .back-to-login { text-align: center; margin-top: 25px; font-size: 14px; }
        .back-to-login a { color: #802c44; text-decoration: none; font-weight: 600; }
        .status-message { background-color: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; display: none; }
        .error-message { background-color: #f8d7da; color: #842029; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; display: none; }
        .brand-panel { flex: 1.2; background-color: #802c44; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 60px; text-align: center; }
        @media (max-width: 768px) { .brand-panel { display: none; } }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-box">
            <!-- Updated path for Firebase -->
            <img src="assets/LOGOUTM.png" alt="UTM Logo" class="utm-logo">
            <h2>Reset Password</h2>
            <p class="instructions">Forgot your password? No problem. Just let us know your email address and we will email you a password reset link.</p>

            <div id="statusMessage" class="status-message"></div>
            <div id="errorMessage" class="error-message"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="your.email@utm.my" required>
                </div>

                <button type="submit" class="btn-submit">Email Password Reset Link</button>
            </form>

            <div class="back-to-login">
                <!-- Redirect back to login.html -->
                <a href="login.html">← Back to Sign In</a>
            </div>
        </div>
    </div>

    <div class="brand-panel">
        <h1>Secure Access</h1>
        <p style="opacity: 0.9; margin-top: 10px;">UTM Clinic Portal Account Recovery</p>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        const form = document.getElementById('forgotPasswordForm');
        const statusDiv = document.getElementById('statusMessage');
        const errorDiv = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            // Reset messages
            statusDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                await sendPasswordResetEmail(auth, email);
                statusDiv.textContent = "Success! Please check your email inbox for the reset link.";
                statusDiv.style.display = 'block';
                form.reset();
            } catch (error) {
                errorDiv.textContent = "Error: " + error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
