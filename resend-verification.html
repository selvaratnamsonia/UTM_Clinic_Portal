<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification - UTM Clinic Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #F7F8FA; }
        .container { background: white; padding: 40px; border-radius: 14px; max-width: 450px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo { height: 80px; margin-bottom: 20px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { background: #802c44; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; }
        button:hover { background: #612134; }
        .message { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        a { color: #802c44; text-decoration: none; display: inline-block; margin-top: 20px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/utm-logo.png" alt="UTM Logo" class="logo">
        <h2>Resend Verification Email</h2>
        <p>Enter your email address to receive a new verification link.</p>
        
        <input type="email" id="email" placeholder="your.email@utm.my">
        <button id="resendBtn">Send Verification Link</button>
        
        <div id="message" class="message"></div>
        
        <p style="margin-top: 20px; font-size: 13px;">
            Already verified? <a href="login.html">Back to Login</a>
        </p>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { sendEmailVerification, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        const resendBtn = document.getElementById('resendBtn');
        const emailInput = document.getElementById('email');
        const messageDiv = document.getElementById('message');

        function showMessage(msg, type) {
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        async function sendVerificationEmail(email) {
            try {
                // First, check if user exists by trying to sign in
                // This is a workaround; in production, use Firebase Admin SDK
                const testPassword = prompt("For security, please enter your password to verify your identity:");
                if (!testPassword) return;
                
                const userCredential = await signInWithEmailAndPassword(auth, email, testPassword);
                const user = userCredential.user;
                
                if (user.emailVerified) {
                    showMessage('Your email is already verified! You can log in now.', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    await sendEmailVerification(user);
                    showMessage(`Verification email sent to ${email}! Please check your inbox.`, 'success');
                    emailInput.value = '';
                }
                await auth.signOut();
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    showMessage('No account found with this email address. Please register first.', 'error');
                } else if (error.code === 'auth/wrong-password') {
                    showMessage('Incorrect password. Please try again.', 'error');
                } else {
                    showMessage('Error: ' + error.message, 'error');
                }
            }
        }

        resendBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }
            
            if (!email.includes('@')) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }
            
            showMessage('Verifying account... Please wait.', 'info');
            await sendVerificationEmail(email);
        });
        
        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                resendBtn.click();
            }
        });
    </script>
</body>
</html>
