<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Diagnosis - UTM Clinic Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #802c44;
            --primary-light: #f4e8ec;
            --primary-hover: #6a2438;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            --success: #10b981;
            --success-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            
            /* Sidebar width configuration */
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- Master Layout Wrapper Container --- */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            background: var(--bg-body);
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* --- Fixed Left Sidebar Container --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--white);
            border-right: 1px solid var(--border-color);
            padding: 32px 0 24px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        /* Clinic Brand Logo Section */
        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px 32px 24px;
        }

        /* Enforces specific box constraints to stop image disappearing actions */
        .brand-logo-img {
            width: 38px;
            height: 38px;
            min-width: 38px;
            min-height: 38px;
            object-fit: contain;
            display: block;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        /* Menu items list setup */
        .nav-menu {
            list-style: none;
            padding: 0 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .nav-item-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
        }

        .nav-item-link i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        /* Navigation link state modifiers */
        .nav-item-link:hover {
            background-color: var(--bg-body);
            color: var(--primary);
        }

        .nav-item-link.active {
            background-color: var(--primary);
            color: var(--white);
        }

        /* Sidebar layout footer area */
        .sidebar-footer {
            padding: 16px 12px 0 12px;
            border-top: 1px solid var(--border-color);
            margin: 0 12px;
        }

        .logout-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: #dc2626;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .logout-link:hover {
            background-color: #fef2f2;
        }

        /* --- Right Workspace Main Frame Workspace Canvas --- */
        .main-content {
            flex-grow: 1;
            margin-left: var(--sidebar-width); /* Essential margin offset gap */
            padding: 24px;
            min-width: 0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Top Action Bar Navigation */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            background: var(--white);
            padding: 14px 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .badge-status {
            background: var(--success-light);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Asymmetric Dashboard Structural Layout Split */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 992px) {
            .dashboard-layout {
                grid-template-columns: 1.62fr 1fr;
                align-items: start;
            }
        }

        .main-panel, .side-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .card-header-compact {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Demographic Metadata Block Styling */
        .patient-hero-card {
            background: linear-gradient(135deg, var(--primary) 0%, #561d2d 100%);
            color: var(--white);
            border: none;
        }

        .patient-hero-card .info-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .patient-hero-card .info-value {
            color: var(--white);
            font-weight: 600;
        }

        .grid-meta-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .meta-metric-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-item {
            background: var(--bg-body);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .diagnosis-text {
            background: #fffbeb;
            border-left: 4px solid var(--warning);
            padding: 16px;
            border-radius: var(--radius-sm);
            line-height: 1.6;
            font-size: 15px;
            color: #78350f;
            font-weight: 500;
        }

        /* Tables Styles */
        .table-responsive-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--white);
            margin-bottom: 8px;
        }

        .medication-table, .billing-table {
            width: 100%;
            border-collapse: collapse;
        }

        .medication-table th, .billing-table th,
        .medication-table td, .billing-table td {
            padding: 14px 16px;
            text-align: left;
            font-size: 14px;
        }

        .medication-table th, .billing-table th {
            background: #f1f5f9;
            font-weight: 700;
            color: var(--text-dark);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .medication-table tr:not(:last-child), .billing-table tr:not(:last-child) {
            border-bottom: 1px solid var(--border-color);
        }

        .medication-table tr:hover, .billing-table tr:hover {
            background: #f8fafc;
        }

        /* Buttons & Forms Layout elements */
        .dispense-btn, .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(128, 44, 68, 0.15);
        }

        .dispense-btn:hover, .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(128, 44, 68, 0.2);
        }

        .dispense-btn:active, .btn-primary:active {
            transform: translateY(0);
        }

        .total-summary-box {
            background: var(--primary-light);
            border: 1px solid rgba(128, 44, 68, 0.2);
            padding: 18px;
            border-radius: var(--radius-md);
            text-align: right;
            margin-top: 8px;
        }

        .total-summary-box .label-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-summary-box .price-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            display: block;
            margin-top: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            background: #f8fafc;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        @media(min-width: 480px) {
            .form-row {
                grid-template-columns: 2fr 1fr auto;
                align-items: flex-end;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--white);
            color: var(--text-dark);
            width: 100%;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        /* Toasts, Loading, Error and Component Boxes */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #0f172a;
            color: white;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast i { color: var(--success); }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.error i { color: #ef4444; }

        @keyframes slideIn {
            from { transform: translateX(110%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .error-box {
            background: #fee2e2;
            color: #dc2626;
            padding: 24px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            border: 1px solid #fca5a5;
        }

        .loading-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 15px;
        }
        .loading-box i {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
        }

        /* --- Premium Blur Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            z-index: 9999;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .custom-modal {
            background: var(--white);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .modal-overlay.active .custom-modal {
            transform: scale(1);
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 16px auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .modal-message {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
        }

        .modal-btn-cancel {
            background: #f1f5f9;
            color: var(--text-dark);
        }
        .modal-btn-cancel:hover { background: #e2e8f0; }

        .modal-btn-confirm {
            background: var(--primary);
            color: white;
        }
        .modal-btn-confirm:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<div class="container">
    <div class="top-bar">
        
        <div class="badge-status">
            <i class="fas fa-circle-check"></i> Connected System Live
        </div>
    </div>

    <div class="dashboard-layout" id="mainDashboardWrapper">
        <div class="loading-box" style="grid-column: span 2; background: white; border-radius: var(--radius-lg);">
            <i class="fas fa-spinner fa-pulse"></i> Loading clinical diagnosis infrastructure...
        </div>
    </div>
</div>

<div class="modal-overlay" id="customConfirmOverlay">
    <div class="custom-modal">
        <div class="modal-icon">
            <i class="fas fa-pills"></i>
        </div>
        <h3 class="modal-title">Confirm Medication Dispense</h3>
        <p class="modal-message" id="customConfirmMessage">Are you sure you want to dispense this medication to the patient?</p>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="cancelDispenseBtn">Cancel Operations</button>
            <button class="modal-btn modal-btn-confirm" id="confirmDispenseBtn">Confirm Dispense</button>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { doc, getDoc, collection, query, where, getDocs, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const appointmentId = urlParams.get('appointmentId');
    let dynamicDiagnosisDocId = null;
    let pendingDispenseAction = null;

    function closeConfirmModal() {
        document.getElementById('customConfirmOverlay').classList.remove('active');
        pendingDispenseAction = null;
    }

    document.getElementById('cancelDispenseBtn').addEventListener('click', closeConfirmModal);
    document.getElementById('confirmDispenseBtn').addEventListener('click', async () => {
        if (pendingDispenseAction) {
            const action = pendingDispenseAction;
            closeConfirmModal();
            await action(); 
        }
    });

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> <span>${message}</span>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    async function loadDiagnosis() {
        const dashboardWrapper = document.getElementById('mainDashboardWrapper');
        
        if (!appointmentId) {
            dashboardWrapper.innerHTML = '<div class="error-box" style="grid-column: span 2;">❌ Critical Link Failure: No valid appointment token configuration parsed.</div>';
            return;
        }

        try {
            const appointmentRef = doc(db, "appointments", appointmentId);
            const appointmentSnap = await getDoc(appointmentRef);
            
            if (!appointmentSnap.exists()) {
                dashboardWrapper.innerHTML = '<div class="error-box" style="grid-column: span 2;">❌ Core Database Synch Error: Selected Appointment sequence identifier does not map to existing records.</div>';
                return;
            }

            const appointmentData = appointmentSnap.data();
            
            let patientName = "Unknown Patient";
            let matricNumber = "N/A";
            if (appointmentData.userId) {
                const userRef = doc(db, "users", appointmentData.userId);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    patientName = userSnap.data().name || patientName;
                    matricNumber = userSnap.data().matricNumber || userSnap.data().matric || matricNumber;
                }
            }

            const diagnosisCollection = collection(db, "diagnosis");
            const diagnosisQuery = query(diagnosisCollection, where("appointmentId", "==", appointmentId));
            const diagnosisSnap = await getDocs(diagnosisQuery);
            
            if (diagnosisSnap.empty) {
                dashboardWrapper.innerHTML = `
                    <div class="card" style="grid-column: span 2; text-align: center; padding: 60px 20px;">
                        <i class="fas fa-file-medical fa-3x" style="color: #cbd5e1; margin-bottom: 16px;"></i>
                        <h3 style="margin-bottom: 6px;">No Diagnosis Record Located</h3>
                        <p style="color: var(--text-muted); font-size: 14px;">The examining physician has not authorized clinical notes or diagnostics for this appointment block.</p>
                    </div>
                `;
                return;
            }

            const diagnosisDoc = diagnosisSnap.docs[0];
            dynamicDiagnosisDocId = diagnosisDoc.id; 
            const diagnosisData = diagnosisDoc.data() || {};
            
            let finalDoctorName = "Dr. Sia Jun Yu"; 

            let medicationsHtml = '';
            if (diagnosisData.medications && Array.isArray(diagnosisData.medications) && diagnosisData.medications.length > 0) {
                medicationsHtml = `
                    <div class="table-responsive-wrapper">
                        <table class="medication-table">
                            <thead>
                                <tr>
                                    <th>Medication Name</th>
                                    <th>Dosage</th>
                                    <th>Frequency</th>
                                    <th>Duration</th>
                                    <th>Clinical Notes</th>
                                    <th style="text-align: right;">Action Fulfillment</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${diagnosisData.medications.map((med, index) => {
                                    const initialStock = 10; 
                                    return `
                                    <tr id="med-row-${index}">
                                        <td><strong>${escapeHtml(med.medication || 'N/A')}</strong></td>
                                        <td><span style="color: var(--text-muted); font-weight: 500;">${escapeHtml(med.dosage || 'N/A')}</span></td>
                                        <td>${escapeHtml(med.frequency || 'N/A')}</td>
                                        <td>${escapeHtml(med.duration || 'N/A')}</td>
                                        <td><span style="font-size: 13px; color: var(--text-muted);">${escapeHtml(med.notes || '-')}</span></td>
                                        <td style="text-align: right;">
                                            <button class="dispense-btn" 
                                                data-medicine="${escapeHtmlAttr(med.medication || '')}" 
                                                data-stock="${initialStock}">
                                                <i class="fas fa-pills"></i> Dispense Unit
                                            </button>
                                        </td>
                                    </tr>
                                `}).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                medicationsHtml = `
                    <div style="background: var(--bg-body); text-align: center; padding: 20px; border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
                        <p style="color: var(--text-muted); font-size: 14px;">No standard prescriptions registered to this record entry.</p>
                    </div>
                `;
            }

            let totalCostAccumulated = 0;
            let additionalItemsHtml = `
                <div class="table-responsive-wrapper">
                    <table class="billing-table">
                        <thead>
                            <tr>
                                <th>Item Specification</th>
                                <th>Unit Cost</th>
                                <th>Quantity</th>
                                <th style="text-align: right;">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (diagnosisData.additionalItems && Array.isArray(diagnosisData.additionalItems) && diagnosisData.additionalItems.length > 0) {
                diagnosisData.additionalItems.forEach(item => {
                    const subtotal = parseFloat(item.cost || 0) * parseInt(item.quantity || 1);
                    totalCostAccumulated += subtotal;
                    additionalItemsHtml += `
                        <tr>
                            <td><strong>${escapeHtml(item.itemName)}</strong></td>
                            <td>RM ${parseFloat(item.cost).toFixed(2)}</td>
                            <td>${item.quantity}</td>
                            <td style="text-align: right; color: var(--primary); font-weight: 700;">RM ${subtotal.toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                additionalItemsHtml += `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">No administrative fees or dispensary provisions appended.</td></tr>`;
            }
            additionalItemsHtml += `</tbody></table></div>`;

            const mcStatusHtml = diagnosisData.mcIssued ? `
                <span class="badge-status" style="background: #fef3c7; color: #d97706; font-size: 11px;"><i class="fas fa-file-signature"></i> Active MC (${diagnosisData.mcDays || 0} Days)</span>
            ` : '<span class="badge-status" style="background: #f1f5f9; color: var(--text-muted); font-size: 11px;"><i class="fas fa-ban"></i> No MC Prescribed</span>';

            dashboardWrapper.innerHTML = `
                <div class="main-panel">
                    <div class="card">
                        <div class="card-header-compact">
                            <div>
                                <h1>Clinical Diagnosis Notes</h1>
                                <p class="subtitle">Assigned physician programmatic findings log</p>
                            </div>
                        </div>
                        <div class="section-title"><i class="fas fa-stethoscope"></i> Chief Diagnostic Summary</div>
                        <div class="diagnosis-text">
                            ${escapeHtml(diagnosisData.diagnosisNotes || 'No primary symptoms descriptive log provided by examining physician.')}
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header-compact">
                            <div>
                                <h1>Prescribed Medical Treatment</h1>
                                <p class="subtitle">Managed item distribution routing panel</p>
                            </div>
                        </div>
                        ${medicationsHtml}
                    </div>
                </div>

                <div class="side-panel">
                    <div class="card patient-hero-card">
                        <div style="margin-bottom: 16px;">
                            <div class="info-label">Active Patient File</div>
                            <div style="font-size: 22px; font-weight: 800; margin-top: 2px;">${escapeHtml(patientName)}</div>
                            <div style="font-size: 13px; opacity: 0.8; margin-top: 2px;">ID Reference: ${escapeHtml(matricNumber)}</div>
                        </div>
                        <div class="grid-meta-metrics">
                            <div class="meta-metric-box">
                                <div class="info-label">Consulting Physician</div>
                                <div class="info-value" style="font-size: 13px; margin-top: 2px;">${escapeHtml(finalDoctorName)}</div>
                            </div>
                            <div class="meta-metric-box">
                                <div class="info-label">Certification Action</div>
                                <div style="margin-top: 4px;">${mcStatusHtml}</div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header-compact">
                            <div>
                                <h1>Billing & Invoice Ledger</h1>
                                <p class="subtitle">Modify non-medic items fee allocation</p>
                            </div>
                        </div>
                        
                        <div class="section-title"><i class="fas fa-cart-plus"></i> Append Billable Provision</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Item Selection</label>
                                <select id="newItemName" class="form-control">
                                    <option value="Face Mask (3-ply)">Face Mask (3-ply)</option>
                                    <option value="N95 Medical Mask">N95 Medical Mask</option>
                                    <option value="Crepe Bandage (7.5cm)">Crepe Bandage (7.5cm)</option>
                                    <option value="Arm Sling Support">Arm Sling Support</option>
                                    <option value="Instant Cold Ice Pack">Instant Cold Ice Pack</option>
                                    <option value="Medical Certificate Copy Fee">Medical Certificate Copy Fee</option>
                                    <option value="Blood Glucose Strip + Test">Blood Glucose Strip + Test</option>
                                    <option value="Sterile Dressing Tray Kit">Sterile Dressing Tray Kit</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Price (RM)</label>
                                <input type="number" id="newItemCost" class="form-control" value="1.00" step="0.01" min="0">
                            </div>
                            <div class="form-group">
                                <label>Qty</label>
                                <div style="display: flex; gap: 8px;">
                                    <input type="number" id="newItemQty" class="form-control" value="1" min="1" style="width: 60px;">
                                    <button type="button" id="addItemBtn" class="btn-primary">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        ${additionalItemsHtml}

                        <div class="total-summary-box">
                            <span class="label-text">Aggregate Net Balance Due</span>
                            <span class="price-text">RM ${totalCostAccumulated.toFixed(2)}</span>
                        </div>

                        <div style="margin-top: 16px;">
                            <button type="button" id="finalizeSessionBtn" class="btn-primary" style="width: 100%; background: #10b981; border-color: #10b981; padding: 12px; font-weight: 700; border-radius: var(--radius-md); transition: background 0.2s;">
                                <i class="fas fa-check-double"></i> Finalize Billing 
                            </button>
                        </div>
                    </div>
                </div>
            `;

            attachDispenseListeners();
            attachBillingFormListeners(totalCostAccumulated);

        } catch (error) {
            console.error("Error loading diagnosis workflow:", error);
            dashboardWrapper.innerHTML = `<div class="error-box" style="grid-column: span 2;">❌ Core Execution Stack Error Exception: ${error.message}</div>`;
        }
    }

    function attachBillingFormListeners(currentTotal) {
        const addItemBtn = document.getElementById('addItemBtn');
        if (addItemBtn) {
            addItemBtn.addEventListener('click', async () => {
                const name = document.getElementById('newItemName').value;
                const cost = parseFloat(document.getElementById('newItemCost').value);
                const qty = parseInt(document.getElementById('newItemQty').value);

                if (!name || isNaN(cost) || isNaN(qty) || qty < 1) {
                    showToast(" Parsing Exception: Invalid payload items dimension structural inputs.", true);
                    return;
                }

                try {
                    addItemBtn.disabled = true;
                    addItemBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                    const diagnosisDocRef = doc(db, "diagnosis", dynamicDiagnosisDocId);
                    const payloadItem = {
                        itemName: name,
                        cost: cost,
                        quantity: qty,
                        addedAt: new Date().toISOString()
                    };

                    await updateDoc(diagnosisDocRef, {
                        additionalItems: arrayUnion(payloadItem)
                    });

                    const appointmentDocRef = doc(db, "appointments", appointmentId);
                    await updateDoc(appointmentDocRef, {
                        status: "diagnosed"
                    });

                    showToast(`Appended adjustment array element [${name}] successfully.`);
                    loadDiagnosis();
                } catch (err) {
                    console.error("Failed executing database update push: ", err);
                    showToast(` Storage Operation Fault: ${err.message}`, true);
                    addItemBtn.disabled = false;
                    addItemBtn.innerHTML = '<i class="fas fa-plus"></i>';
                }
            });
        }

        // Finalize Transaction Logic
        const finalizeBtn = document.getElementById('finalizeSessionBtn');
        if (finalizeBtn) {
            finalizeBtn.addEventListener('click', async () => {
                try {
                    finalizeBtn.disabled = true;
                    finalizeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Finalizing...';

                    const appointmentDocRef = doc(db, "appointments", appointmentId);
                    
                    // Updates variables so patient view can securely fetch and manage invoice status updates
                    await updateDoc(appointmentDocRef, {
                        status: "completed",
                        totalBillAmount: currentTotal,
                        paymentStatus: "pending", 
                        billingFinalized: true,
                        sessionFinalizedAt: new Date().toISOString()
                    });

                    showToast("Transaction finalized! Invoice dispatched to patient file.");
                    
                    setTimeout(() => {
                        window.location.href = 'staff_dashboard.html';
                    }, 1500);

                } catch (err) {
                    console.error("Failed to finalize transaction sequence: ", err);
                    showToast(`Finalize Operation Fault: ${err.message}`, true);
                    finalizeBtn.disabled = false;
                    finalizeBtn.innerHTML = '<i class="fas fa-check-double"></i> Finalize Billing';
                }
            });
        }
    }

    async function attachDispenseListeners() {
        const dispenseBtns = document.querySelectorAll('.dispense-btn');
        for (const btn of dispenseBtns) {
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', () => {
                const medicineName = newBtn.getAttribute('data-medicine');
                document.getElementById('customConfirmMessage').innerHTML = 
                    `Are you sure you want to finalize stock distribution and dispense <strong>${escapeHtml(medicineName)}</strong> to the patient file?`;
                
                pendingDispenseAction = async () => {
                    try {
                        const medicationsRef = collection(db, "medications");
                        const medQuery = query(medicationsRef, where("name", "==", medicineName));
                        const medSnap = await getDocs(medQuery);
                        
                        if (!medSnap.empty) {
                            const medDoc = medSnap.docs[0];
                            const medData = medDoc.data();
                            const currentDbStock = medData.stock !== undefined ? parseInt(medData.stock) : 0;
                            const newStock = currentDbStock - 1;
                            
                            if (currentDbStock <= 0) {
                                showToast(` Inventory Fault: "${medicineName}" stock tracking array reads zero allocation units.`, true);
                                return;
                            }

                            await updateDoc(doc(db, "medications", medDoc.id), { stock: newStock });
                            showToast(`Dispensary sequence finalized: ${medicineName}. Live Stock Remaining: ${newStock}`);
                        } else {
                            showToast(` Database Mismatch Error: "${medicineName}" inventory definition metadata structure not found.`, true);
                        }
                    } catch (error) {
                        console.error("Error dispensing medication:", error);
                        showToast(` Internal Processing Fault: ${error.message}`, true);
                    }
                };

                document.getElementById('customConfirmOverlay').classList.add('active');
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function escapeHtmlAttr(str) {
        if (!str) return '';
        return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        loadDiagnosis();
    });
</script>
</body>
</html>
