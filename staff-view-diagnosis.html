<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Diagnosis - UTM Clinic Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #802c44;
            --primary-light: #f4e8ec;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .diagnosis-text {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .medication-table {
            width: 100%;
            border-collapse: collapse;
        }

        .medication-table th,
        .medication-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .medication-table th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #dcfce7;
            color: #15803d;
        }

        .dispense-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .dispense-btn:hover {
            background: #6a2438;
        }

        .dispense-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.error { background: #ef4444; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .error-box {
            background: #fee2e2;
            color: #dc2626;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .loading-box {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="staff-manage-appointments.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back to Appointments
    </a>

    <div class="card">
        <h1 id="pageTitle">Diagnosis Details</h1>
        <p class="subtitle" id="patientInfo">Loading...</p>

        <div id="diagnosisContent">
            <div class="loading-box">
                <i class="fas fa-spinner fa-pulse"></i> Loading diagnosis information...
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { doc, getDoc, collection, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const appointmentId = urlParams.get('appointmentId');

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = `toast ${isError ? 'error' : ''}`;
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function loadDiagnosis() {
        const contentDiv = document.getElementById('diagnosisContent');
        
        if (!appointmentId) {
            contentDiv.innerHTML = '<div class="error-box">❌ No appointment ID provided. Please go back and try again.</div>';
            return;
        }

        try {
            // First, verify the appointment exists
            const appointmentRef = doc(db, "appointments", appointmentId);
            const appointmentSnap = await getDoc(appointmentRef);
            
            if (!appointmentSnap.exists()) {
                contentDiv.innerHTML = '<div class="error-box">❌ Appointment not found in the database.</div>';
                return;
            }

            const appointmentData = appointmentSnap.data();
            
            // Fetch patient info
            let patientName = "Unknown Patient";
            let matricNumber = "N/A";
            if (appointmentData.userId) {
                const userRef = doc(db, "users", appointmentData.userId);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    patientName = userSnap.data().name || patientName;
                    matricNumber = userSnap.data().matricNumber || userSnap.data().matric || matricNumber;
                }
            }

            document.getElementById('patientInfo').innerHTML = `${escapeHtml(patientName)} • ${escapeHtml(matricNumber)}`;
            document.getElementById('pageTitle').innerHTML = `Diagnosis for ${escapeHtml(patientName)}`;

            // Query the diagnosis collection for this appointment
            const diagnosisCollection = collection(db, "diagnosis");
            const diagnosisQuery = query(diagnosisCollection, where("appointmentId", "==", appointmentId));
            const diagnosisSnap = await getDocs(diagnosisQuery);
            
            // Check if we got any results
            if (diagnosisSnap.empty) {
                contentDiv.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <i class="fas fa-file-medical fa-3x" style="color: #cbd5e1; margin-bottom: 15px;"></i>
                        <p>No diagnosis has been recorded for this appointment yet.</p>
                        <p style="font-size: 14px; margin-top: 10px;">The doctor needs to complete the diagnosis first.</p>
                    </div>
                `;
                return;
            }

            // Get the first diagnosis document (there should be only one per appointment)
            const diagnosisDoc = diagnosisSnap.docs[0];
            const diagnosisData = diagnosisDoc.data();
            
            // Build medications HTML
            let medicationsHtml = '';
            if (diagnosisData.medications && Array.isArray(diagnosisData.medications) && diagnosisData.medications.length > 0) {
                medicationsHtml = `
                    <table class="medication-table">
                        <thead>
                            <tr>
                                <th>Medication</th>
                                <th>Dosage</th>
                                <th>Frequency</th>
                                <th>Duration</th>
                                <th>Notes</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${diagnosisData.medications.map((med, index) => `
                                <tr id="med-row-${index}">
                                    <td>${escapeHtml(med.medication || 'N/A')}</td>
                                    <td>${escapeHtml(med.medicationDetails?.dosage || med.dosage || 'N/A')}</td>
                                    <td>${escapeHtml(med.frequency || 'N/A')}</td>
                                    <td>${escapeHtml(med.duration || 'N/A')}</td>
                                    <td>${escapeHtml(med.notes || '-')}</td>
                                    <td>
                                        <button class="dispense-btn" 
                                            data-medicine="${escapeHtml(med.medication)}" 
                                            data-stock="${med.medicationDetails?.stock || 0}"
                                            data-med-id="${med.medicationDetails?.id || ''}">
                                            <i class="fas fa-pills"></i> Dispense
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                medicationsHtml = '<p style="color: var(--text-muted);">No medications prescribed.</p>';
            }

            // Build MC HTML
            const mcHtml = diagnosisData.mcIssued ? `
                <div class="info-item">
                    <div class="info-label">Medical Certificate</div>
                    <div class="info-value">✅ Issued (${diagnosisData.mcDays || 0} days rest recommended)</div>
                </div>
            ` : '<div class="info-item"><div class="info-label">Medical Certificate</div><div class="info-value">❌ Not issued</div></div>';

            // Build the full content
            contentDiv.innerHTML = `
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Doctor</div>
                        <div class="info-value">Dr. ${escapeHtml(diagnosisData.doctorName || 'Unknown')}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Date of Diagnosis</div>
                        <div class="info-value">${new Date(diagnosisData.createdAt).toLocaleDateString()}</div>
                    </div>
                    ${mcHtml}
                </div>

                <div class="section-title">
                    <i class="fas fa-stethoscope"></i> Diagnosis
                </div>
                <div class="diagnosis-text">
                    ${escapeHtml(diagnosisData.diagnosisNotes || 'No diagnosis notes provided.')}
                </div>

                <div class="section-title">
                    <i class="fas fa-prescription-bottle"></i> Prescribed Medications
                </div>
                ${medicationsHtml}
            `;

            // Attach dispense event listeners after content is loaded
            attachDispenseListeners();

        } catch (error) {
            console.error("Error loading diagnosis:", error);
            contentDiv.innerHTML = `<div class="error-box">❌ Error loading data: ${error.message}</div>`;
        }
    }

    async function attachDispenseListeners() {
        const dispenseBtns = document.querySelectorAll('.dispense-btn');
        
        for (const btn of dispenseBtns) {
            // Remove any existing listeners to avoid duplicates
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('click', async () => {
                const medicineName = newBtn.getAttribute('data-medicine');
                const currentStock = parseInt(newBtn.getAttribute('data-stock'));
                
                if (isNaN(currentStock) || currentStock <= 0) {
                    showToast(`❌ ${medicineName} is out of stock!`, true);
                    return;
                }
                
                if (confirm(`Dispense "${medicineName}" to patient?`)) {
                    try {
                        // Query the medications collection to find the matching medication
                        const medicationsRef = collection(db, "medications");
                        const medQuery = query(medicationsRef, where("name", "==", medicineName));
                        const medSnap = await getDocs(medQuery);
                        
                        if (!medSnap.empty) {
                            const medDoc = medSnap.docs[0];
                            const medData = medDoc.data();
                            const newStock = (medData.stock || 0) - 1;
                            
                            await updateDoc(doc(db, "medications", medDoc.id), { stock: newStock });
                            showToast(`✅ ${medicineName} dispensed successfully! Remaining stock: ${newStock}`);
                            
                            // Update button attributes and appearance
                            newBtn.setAttribute('data-stock', newStock);
                            newBtn.innerHTML = `<i class="fas fa-pills"></i> Dispense (${newStock} left)`;
                            
                            if (newStock <= 0) {
                                newBtn.disabled = true;
                                newBtn.innerHTML = `<i class="fas fa-ban"></i> Out of Stock`;
                            }
                        } else {
                            showToast(`❌ Could not find "${medicineName}" in inventory`, true);
                        }
                    } catch (error) {
                        console.error("Error dispensing medication:", error);
                        showToast(`❌ Error dispensing: ${error.message}`, true);
                    }
                }
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Check authentication
    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        loadDiagnosis();
    });
</script>
</body>
</html>
