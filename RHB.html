<!-- RHB Now FPX simulation – creates payment with sequential ID -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHB Now | Premium FPX Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --rhb-blue: #0054a6; --rhb-accent: #e5a700; --surface-bg: #f4f7fb; --card-bg: #ffffff; --text-main: #0f172a; --border-light: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--surface-bg); display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--rhb-blue); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--rhb-accent); }
        .logo-text { color: #fff; font-size: 24px; font-weight: 800; }
        .fpx-logo { background: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 800; color: var(--rhb-blue); }
        .container { flex:1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .bank-card { background: var(--card-bg); width: 100%; max-width: 460px; border-radius: 16px; box-shadow: 0 20px 40px -10px rgba(0,84,166,0.1); overflow: hidden; }
        .card-header { background: #fff; padding: 28px 30px 10px; text-align: center; }
        .invoice-summary { background: #f8fafc; margin: 24px 30px; padding: 20px; border-radius: 8px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 12px; }
        .card-body { padding: 0 30px 30px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .input-field { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border-light); border-radius: 8px; }
        .tac-box { display: flex; gap: 12px; }
        .btn-tac { background: var(--rhb-blue); color: #fff; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; }
        .btn-submit { width: 100%; background: var(--rhb-accent); color: #fff; border: none; padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-cancel { width: 100%; background: transparent; color: var(--text-muted); border: none; padding: 12px; cursor: pointer; margin-top: 8px; }
        footer { background: #0f172a; color: #64748b; text-align: center; padding: 20px; font-size: 12px; }
    </style>
</head>
<body>
<header><div class="logo-text">RHB<span style="font-weight:400;">Now</span></div><div class="fpx-logo">FPX</div></header>
<div class="container">
    <div class="bank-card">
        <div class="card-header"><h2>Secure Interactive FPX Session</h2></div>
        <div class="invoice-summary">
            <div class="summary-row"><span>Merchant:</span><strong>UTM Medical Clinic Portal</strong></div>
            <div class="summary-row"><span>Reference:</span><span id="refDisplay">Loading...</span></div>
            <div class="summary-row"><span>Amount:</span><strong style="color:var(--rhb-blue);" id="amountDisplay">RM 0.00</strong></div>
        </div>
        <div class="card-body">
            <div class="form-group"><label>RHB Internet Banking Username</label><input type="text" class="input-field" value="utm_student2026" readonly></div>
            <div class="form-group"><label>Secure OTP Token</label><div class="tac-box"><input type="text" id="tacInput" class="input-field" placeholder="6-digit OTP"><button type="button" class="btn-tac" id="getTacBtn">Generate Token</button></div></div>
            <button type="button" class="btn-submit" id="confirmBtn">Confirm Transaction Release</button>
            <button type="button" class="btn-cancel" onclick="window.history.back()">Terminate Session</button>
        </div>
    </div>
</div>
<footer>RHB Bank Berhad. All rights reserved.</footer>

<script type="module">
    import { db } from './js/firebase-config.js';
    import { doc, getDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const aptId = urlParams.get('aptId');
    const amount = parseFloat(urlParams.get('amount')) || 0;
    document.getElementById('amountDisplay').innerText = `RM ${amount.toFixed(2)}`;
    document.getElementById('refDisplay').innerText = aptId ? `RHB-${aptId.substring(0,8).toUpperCase()}` : "N/A";

    async function getNextPaymentId() {
        const counterRef = doc(db, "counters", "payments");
        let snap = await getDoc(counterRef);
        let next;
        if (!snap.exists()) {
            await setDoc(counterRef, { nextId: 1 });
            next = 1;
        } else {
            next = snap.data().nextId;
            await updateDoc(counterRef, { nextId: next + 1 });
        }
        return `Pay_${next.toString().padStart(3, '0')}`;
    }

    document.getElementById('getTacBtn').addEventListener('click', () => {
        document.getElementById('tacInput').value = "302811";
        alert("Simulated OTP: 302811");
    });

    document.getElementById('confirmBtn').addEventListener('click', async () => {
        if(!document.getElementById('tacInput').value) { alert("Please generate OTP."); return; }
        const btn = document.getElementById('confirmBtn');
        btn.disabled = true; btn.innerText = "Authorizing...";
        try {
            const aptRef = doc(db, "appointments", aptId);
            const aptSnap = await getDoc(aptRef);
            const aptData = aptSnap.exists() ? aptSnap.data() : {};
            const items = [{ itemName: "Standard Outpatient Service Fee", unitCost: amount, quantity: 1, subtotal: amount }];
            const paymentId = await getNextPaymentId();
            await setDoc(doc(db, "payments", paymentId), {
                appointmentId: aptId,
                studentName: aptData.patientName || "Patient",
                studentId: aptData.matricNumber || "N/A",
                appointmentDate: aptData.date,
                appointmentTime: aptData.time,
                items: items,
                amount: amount,
                paymentChannel: "FPX",
                status: "pending",
                transactionReference: `FPX-RHB-${Math.floor(100000+Math.random()*900000)}`,
                createdAt: new Date()
            });
            await updateDoc(aptRef, { status: "pending-payment-verification", paymentStatus: "pending" });
            alert("Transaction logged! Pending verification.");
            window.location.href = "appointments.html";
        } catch(e) { console.error(e); alert("Error."); btn.disabled=false; btn.innerText="Confirm Transaction Release"; }
    });
</script>
</body>
</html>
