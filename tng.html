<!-- Touch 'n Go eWallet simulation – creates payment with sequential ID -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch 'n Go eWallet Secure Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --tng-blue: #0052b4; --tng-light: #e0f2fe; --bg-body: #f1f5f9; --white: #ffffff; --text-dark: #0f172a; --text-muted: #64748b; --success: #10b981; --border-color: #e2e8f0; --radius: 16px; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background: var(--bg-body); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .gateway-container { width: 100%; max-width: 480px; background: var(--white); border-radius: var(--radius); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        .gateway-header { background: var(--tng-blue); color: white; padding: 24px; text-align: center; }
        .tng-logo-text { font-size: 24px; font-weight: 800; }
        .order-summary { background: #fafbfc; padding: 24px; text-align: center; border-bottom: 1px dashed var(--border-color); }
        .merchant-name { font-size: 16px; font-weight: 700; margin: 8px 0; }
        .amount-display { font-size: 36px; font-weight: 800; color: var(--tng-blue); }
        .gateway-body { padding: 28px 24px; }
        .payment-notice { background: var(--tng-light); padding: 14px; border-radius: 12px; display: flex; gap: 12px; margin-bottom: 24px; }
        .meta-row { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .btn-tng-pay { width: 100%; background: var(--tng-blue); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-tng-cancel { width: 100%; background: transparent; border: none; padding: 14px; color: var(--text-muted); cursor: pointer; margin-top: 8px; }
        .screen-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: white; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; }
        .spinner-icon { font-size: 48px; color: var(--tng-blue); margin-bottom: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-icon { font-size: 64px; color: var(--success); margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="gateway-container">
    <div id="statusOverlay" class="screen-overlay">
        <div id="spinnerView"><i class="fas fa-circle-notch fa-spin spinner-icon"></i><div class="status-title">Processing Transaction</div><div>Please wait...</div></div>
        <div id="successView" style="display:none;"><i class="fas fa-check-circle success-icon"></i><div class="status-title">Payment Successful!</div><div id="successRefMessage"></div></div>
    </div>
    <div class="gateway-header"><div class="tng-logo-text">touch 'n go</div><div class="tng-logo-subtitle">eWallet Gateway</div></div>
    <div class="order-summary"><div class="merchant-label">MERCHANT</div><div class="merchant-name"><i class="fas fa-clinic-medical" style="color:#802c44;"></i> UTM Clinic</div><div class="amount-display" id="displayAmount">RM 0.00</div></div>
    <div class="gateway-body">
        <div class="payment-notice"><i class="fas fa-shield-alt"></i><div>Simulated secure payment – click below to record transaction.</div></div>
        <div class="meta-group"><div class="meta-row"><span>Appointment ID</span><span id="displayAptId">Loading...</span></div></div>
        <button type="button" class="btn-tng-pay" id="confirmTngPaymentBtn"><i class="fas fa-lock"></i> Pay Securely Now</button>
        <button type="button" class="btn-tng-cancel" id="cancelTngPaymentBtn">Cancel</button>
    </div>
</div>

<script type="module">
    import { db } from './js/firebase-config.js';
    import { doc, getDoc, updateDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const aptId = urlParams.get('aptId');
    const amount = parseFloat(urlParams.get('amount')) || 0;
    document.getElementById('displayAmount').innerText = `RM ${amount.toFixed(2)}`;
    document.getElementById('displayAptId').innerText = aptId || "MISSING";

    // Sequential payment ID
    async function getNextPaymentId() {
        const counterRef = doc(db, "counters", "payments");
        let snap = await getDoc(counterRef);
        let next;
        if (!snap.exists()) {
            await setDoc(counterRef, { nextId: 1 });
            next = 1;
        } else {
            next = snap.data().nextId;
            await updateDoc(counterRef, { nextId: next + 1 });
        }
        return `Pay_${next.toString().padStart(3, '0')}`;
    }

    document.getElementById('confirmTngPaymentBtn').addEventListener('click', async () => {
        const overlay = document.getElementById('statusOverlay');
        const spinner = document.getElementById('spinnerView');
        const success = document.getElementById('successView');
        overlay.style.display = 'flex';
        try {
            const aptRef = doc(db, "appointments", aptId);
            const aptSnap = await getDoc(aptRef);
            const aptData = aptSnap.exists() ? aptSnap.data() : {};
            // Build item list from diagnosis additionalItems
            let items = [];
            let total = amount;
            const diagQuery = query(collection(db, "diagnosis"), where("appointmentId", "==", aptId));
            const diagSnap = await getDocs(diagQuery);
            diagSnap.forEach(d => {
                (d.data().additionalItems || []).forEach(item => {
                    items.push({ itemName: item.itemName, unitCost: item.cost, quantity: item.quantity, subtotal: (item.cost||0)*(item.quantity||1) });
                });
            });
            if (items.length === 0) items = [{ itemName: "Standard Outpatient Service Fee", unitCost: amount, quantity: 1, subtotal: amount }];
            const paymentId = await getNextPaymentId();
            await setDoc(doc(db, "payments", paymentId), {
                appointmentId: aptId,
                studentName: aptData.patientName || "Patient",
                studentId: aptData.matricNumber || "N/A",
                appointmentDate: aptData.date,
                appointmentTime: aptData.time,
                items: items,
                amount: total,
                paymentChannel: "TNG",
                status: "pending",
                transactionReference: `TNG-${Math.random().toString(36).substr(2,9).toUpperCase()}`,
                createdAt: new Date()
            });
            await updateDoc(aptRef, { status: "pending-payment-verification", paymentStatus: "pending" });
            spinner.style.display = 'none';
            success.style.display = 'block';
            document.getElementById('successRefMessage').innerText = `Transaction recorded. Pending staff verification.`;
            setTimeout(() => window.location.href = 'appointments.html', 3000);
        } catch(err) { console.error(err); alert("Error."); overlay.style.display = 'none'; }
    });
    document.getElementById('cancelTngPaymentBtn').addEventListener('click', () => window.location.href = `patient-pay-page.html?aptId=${aptId}`);
</script>
</body>
</html>
