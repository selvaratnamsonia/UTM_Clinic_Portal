<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Claim Appointments - UTM Clinic</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>

        :root {
            --primary: #802c44;
            --primary-hover: #6a2438;
            --primary-light: #fdf2f8;
            --bg: #f8fafc;
            --white: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 20px rgba(0,0,0,0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            color: var(--text);
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 270px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 30px 0;
            display: flex;
            flex-direction: column;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 24px 40px;
        }

        .logo-box {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 14px;
            flex: 1;
        }

        .nav-link {
            text-decoration: none;
            color: var(--muted);
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            font-weight: 600;
        }

        .nav-link:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .sidebar-footer {
            padding: 20px 14px 0;
            border-top: 1px solid var(--border);
        }

        .logout-link {
            color: #ef4444 !important;
        }

        .logout-link:hover {
            background: #fef2f2 !important;
        }

        /* ================= MAIN ================= */

        .main-content {
            flex: 1;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 800;
        }

        .header p {
            color: var(--muted);
            margin-top: 5px;
        }

        .badge-count {
            background: var(--primary-light);
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
        }

        /* ================= TOOLBAR ================= */

        .toolbar {
            background: white;
            border: 1px solid var(--border);
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 10px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
        }

        /* ================= APPOINTMENTS ================= */

        .appointments-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .appointment-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 24px;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-main h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .info-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .info-item span {
            color: var(--text);
            font-weight: 600;
        }

        .claim-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .claim-btn:hover {
            background: var(--primary-hover);
        }

        /* ================= EMPTY ================= */

        .empty-state {
            display: none;
            text-align: center;
            padding: 60px;
            color: var(--muted);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 16px;
            color: #10b981;
        }

        @media(max-width: 768px) {

            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .main-content {
                padding: 20px;
            }

            .appointment-card {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .info-grid {
                justify-content: center;
            }

            .claim-btn {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo-container">

            <div class="logo-box">
                <img src="images/Clinic-logo.png" alt="Logo">
            </div>

            <div class="logo-text">
                UTM Clinic
            </div>

        </div>

        <nav class="nav-links">

            <a href="doctor_dashboard.html" class="nav-link">
                <i class="fas fa-columns"></i>
                Dashboard
            </a>

            <a href="claim-appointment.html" class="nav-link active">
                <i class="fas fa-calendar-alt"></i>
                Claim Appointments
            </a>

        </nav>

        <div class="sidebar-footer">

            <a href="login.html" class="nav-link logout-link">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main-content">

        <div class="container">

            <div class="header">

                <div>
                    <h1>Claim Appointments</h1>
                    <p>Appointments waiting for doctor assignment.</p>
                </div>

                <div class="badge-count" id="badgeCount">
                    0 Available
                </div>

            </div>

            <div class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-calendar"></i>

                    <input
                        type="date"
                        id="filterDate"
                    >

                </div>

                <button class="clear-btn" id="resetBtn">
                    Reset View
                </button>

            </div>

            <div class="appointments-grid" id="apptGrid"></div>

            <div class="empty-state" id="emptyState">

                <i class="fa-solid fa-circle-check"></i>

                <h3>No Available Appointments</h3>

                <p>All appointments have been claimed.</p>

            </div>

        </div>

    </main>

    <!-- FIREBASE -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs,
            updateDoc,
            doc
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ================= FIREBASE CONFIG =================

        const firebaseConfig = {

            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"

        };

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);

        // ================= ELEMENTS =================

        const apptGrid =
            document.getElementById("apptGrid");

        const emptyState =
            document.getElementById("emptyState");

        const badgeCount =
            document.getElementById("badgeCount");

        const filterDate =
            document.getElementById("filterDate");

        const resetBtn =
            document.getElementById("resetBtn");

        // ================= LOAD APPOINTMENTS =================

        async function loadAppointments() {

            apptGrid.innerHTML = "";

            emptyState.style.display = "none";

            try {

                console.log("Loading appointments...");

                const snapshot = await getDocs(
                    collection(db, "appointments")
                );

                console.log(
                    "Documents found:",
                    snapshot.size
                );

                let count = 0;

                snapshot.forEach((appointmentDoc) => {

                    const data = appointmentDoc.data();

                    console.log(data);

                    // ONLY SHOW CLAIMABLE APPOINTMENTS
                    const isClaimable =
                        (!data.doctorId ||
                            data.doctorId === "") &&

                        (!data.doctorName ||
                            data.doctorName === "") &&

                        data.status === "pending";

                    if (!isClaimable) return;

                    count++;

                    const initials =
                        (data.patientName || "NA")
                        .split(" ")
                        .map(word => word[0])
                        .join("")
                        .substring(0, 2);

                    const card =
                        document.createElement("div");

                    card.className =
                        "appointment-card";

                    card.dataset.date =
                        data.date || "";

                    card.innerHTML = `

                        <div class="avatar">
                            ${initials}
                        </div>

                        <div class="info-main">

                            <h3>
                                ${data.patientName || "Unknown"}
                            </h3>

                            <div class="info-grid">

                                <div class="info-item">
                                    <i class="fa-solid fa-calendar"></i>
                                    Date:
                                    <span>${data.date || "-"}</span>
                                </div>

                                <div class="info-item">
                                    <i class="fa-solid fa-clock"></i>
                                    Time:
                                    <span>${data.time || "-"}</span>
                                </div>

                                <div class="info-item">
                                    <i class="fa-solid fa-stethoscope"></i>
                                    Reason:
                                    <span>${data.reason || "-"}</span>
                                </div>

                            </div>

                        </div>

                        <button class="claim-btn">
                            Claim
                        </button>

                    `;

                    const claimBtn =
                        card.querySelector(".claim-btn");

                    claimBtn.addEventListener(
                        "click",
                        async () => {

                            const confirmClaim =
                                confirm(
                                    "Claim this appointment?"
                                );

                            if (!confirmClaim) return;

                            try {

                                const appointmentRef =
                                    doc(
                                        db,
                                        "appointments",
                                        appointmentDoc.id
                                    );

                                await updateDoc(
                                    appointmentRef,
                                    {
                                        doctorId: "doctor001",
                                        doctorName: "Dr. Sarah",
                                        status: "claimed"
                                    }
                                );

                                alert(
                                    "Appointment claimed successfully."
                                );

                                loadAppointments();

                            } catch(error) {

                                console.error(error);

                                alert(
                                    "Failed to claim appointment."
                                );

                            }

                        }
                    );

                    apptGrid.appendChild(card);

                });

                badgeCount.innerText =
                    count + " Available";

                if (count === 0) {

                    emptyState.style.display = "block";

                }

            } catch(error) {

                console.error(
                    "Firestore Error:",
                    error
                );

                alert(
                    "Failed to load appointments. Check console."
                );

            }

        }

        // ================= FILTER =================

        filterDate.addEventListener(
            "change",
            () => {

                const selectedDate =
                    filterDate.value;

                const cards =
                    document.querySelectorAll(
                        ".appointment-card"
                    );

                cards.forEach(card => {

                    const cardDate =
                        card.dataset.date;

                    if (
                        selectedDate === "" ||
                        selectedDate === cardDate
                    ) {

                        card.style.display = "grid";

                    } else {

                        card.style.display = "none";

                    }

                });

            }
        );

        // ================= RESET =================

        resetBtn.addEventListener(
            "click",
            () => {

                filterDate.value = "";

                document
                    .querySelectorAll(
                        ".appointment-card"
                    )
                    .forEach(card => {

                        card.style.display = "grid";

                    });

            }
        );

        // ================= START =================

        loadAppointments();

    </script>

</body>
</html>
