<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .bg-primary { background-color: #802c44; }
        .text-primary { color: #802c44; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r p-4">
            <div class="font-bold text-xl mb-8">UTM Clinic</div>
            <nav class="space-y-2">
                <a href="admin-dashboard.html" class="block p-2 bg-primary text-white rounded">Dashboard</a>
                <a href="manage-doctors.html" class="block p-2 hover:bg-gray-100 rounded">Manage Doctors</a>
                <a href="manage-staff.html" class="block p-2 hover:bg-gray-100 rounded">Manage Staff</a>
                <button id="logoutBtn" class="w-full text-left p-2 hover:bg-gray-100 rounded">Logout</button>
            </nav>
        </aside>
        <main class="flex-1 p-8">
            <h1 class="text-3xl font-bold">Admin Dashboard</h1>
            <p class="text-gray-500 mb-8">Welcome, <span id="adminName">Admin</span></p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded shadow">
                    <i class="fas fa-users text-2xl text-primary mb-2"></i>
                    <h3 class="text-2xl font-bold" id="totalPatients">0</h3>
                    <p>Total Patients</p>
                </div>
                <div class="bg-white p-6 rounded shadow">
                    <i class="fas fa-user-md text-2xl text-primary mb-2"></i>
                    <h3 class="text-2xl font-bold" id="totalDoctors">0</h3>
                    <p>Doctors</p>
                </div>
                <div class="bg-white p-6 rounded shadow">
                    <i class="fas fa-calendar text-2xl text-primary mb-2"></i>
                    <h3 class="text-2xl font-bold" id="todayAppointments">0</h3>
                    <p>Today's Appointments</p>
                </div>
            </div>
        </main>
    </div>
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) document.getElementById('adminName').innerText = userDoc.data().name || 'Admin';
            
            // Count patients (role = patient)
            const patientsQuery = query(collection(db, "users"), where("role", "==", "patient"));
            const patientsSnap = await getDocs(patientsQuery);
            document.getElementById('totalPatients').innerText = patientsSnap.size;
            
            const doctorsQuery = query(collection(db, "users"), where("role", "==", "doctor"));
            const doctorsSnap = await getDocs(doctorsQuery);
            document.getElementById('totalDoctors').innerText = doctorsSnap.size;
            
            const today = new Date().toISOString().slice(0,10);
            const aptQuery = query(collection(db, "appointments"), where("date", "==", today));
            const aptSnap = await getDocs(aptQuery);
            document.getElementById('todayAppointments').innerText = aptSnap.size;
        });
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
