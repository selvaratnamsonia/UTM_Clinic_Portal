<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - UTM Clinic Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #F7F8FA;
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #EAEAEA;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 0 20px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #802c44;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
        }

        .nav-link {
            padding: 14px 20px;
            color: #555;
            transition: 0.2s;
            text-decoration: none;
        }

        .nav-link:hover {
            background: #f5f5f5;
        }

        .nav-link.active {
            background: #802c44;
            color: white;
        }

        /* ================= MAIN ================= */
        .main {
            flex: 1;
            padding: 40px;
            max-width: 900px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #EAEAEA;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        input:disabled, textarea:disabled {
            background-color: #f0f0f0;
            color: #666;
            cursor: not-allowed;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #802c44;
        }

        .readonly-field {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            color: #333;
        }

        .text-muted {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin-right: 10px;
        }

        .btn-primary {
            background: #802c44;
            color: white;
        }

        .btn-primary:hover {
            background: #612134;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ccc;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .action-buttons {
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .sidebar .logo, .sidebar .nav-link span {
                display: none;
            }
            .main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <div class="logo">
        UTM Clinic
    </div>
    <div class="nav-links">
        <a href="patient_dashboard.html" class="nav-link">Dashboard</a>
        <a href="appointments.html" class="nav-link">Appointments</a>
        <a href="book-appointment.html" class="nav-link">Book Appointment</a>
        <a href="patient-profile.html" class="nav-link active">Profile</a>
        <a href="#" id="logoutLink" class="nav-link">Logout</a>
    </div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">
    <h1>My Profile</h1>
    <p class="subtitle">View and manage your personal information</p>

    <!-- Alert messages -->
    <div id="alertSuccess" class="alert alert-success"></div>
    <div id="alertError" class="alert alert-error"></div>

    <!-- ================= PERSONAL INFO ================= -->
    <div class="card">
        <h2>👤 Personal Information</h2>

        <form id="profileForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" disabled>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" disabled>
                <div class="text-muted">Email cannot be changed</div>
            </div>

            <div class="form-group">
                <label>Matric Number</label>
                <input type="text" id="matricNumber" disabled>
                <div class="text-muted">Matric number cannot be changed</div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" disabled>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="3" disabled></textarea>
            </div>

            <div class="action-buttons">
                <button type="button" id="editBtn" class="btn btn-primary">Edit Profile</button>
                <button type="submit" id="saveBtn" class="btn btn-success" style="display: none;">Save Changes</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
            </div>
        </form>
    </div>

    <!-- ================= PASSWORD CHANGE ================= -->
    <div class="card">
        <h2>🔒 Change Password</h2>
        <form id="passwordForm">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required minlength="8">
                <div class="text-muted">Minimum 8 characters</div>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>
    </div>
</div>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // Auth check
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        loadUserData(user.uid);
    });

    // Load user data from Firestore
    async function loadUserData(userId) {
        const userRef = doc(db, "users", userId);
        const userSnap = await getDoc(userRef);
        
        if (userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById('name').value = data.name || '';
            document.getElementById('email').value = auth.currentUser?.email || '';
            document.getElementById('matricNumber').value = data.matricNumber || '';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('address').value = data.address || '';
        }
    }

    // Toggle edit mode
    let isEditMode = false;
    
    document.getElementById('editBtn').addEventListener('click', () => {
        isEditMode = true;
        // Enable form fields
        document.getElementById('name').disabled = false;
        document.getElementById('phone').disabled = false;
        document.getElementById('address').disabled = false;
        // Show/hide buttons
        document.getElementById('editBtn').style.display = 'none';
        document.getElementById('saveBtn').style.display = 'inline-block';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
        isEditMode = false;
        // Reload original data
        loadUserData(auth.currentUser.uid);
        // Disable fields again
        document.getElementById('name').disabled = true;
        document.getElementById('phone').disabled = true;
        document.getElementById('address').disabled = true;
        // Show/hide buttons
        document.getElementById('editBtn').style.display = 'inline-block';
        document.getElementById('saveBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
        hideAlerts();
    });

    // Save profile changes
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const user = auth.currentUser;
        if (!user) return;

        const updatedData = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value
        };

        try {
            const userRef = doc(db, "users", user.uid);
            await updateDoc(userRef, updatedData);
            
            showAlert('Profile updated successfully!', 'success');
            
            // Exit edit mode
            isEditMode = false;
            document.getElementById('name').disabled = true;
            document.getElementById('phone').disabled = true;
            document.getElementById('address').disabled = true;
            document.getElementById('editBtn').style.display = 'inline-block';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
            
            // Reload data to confirm
            await loadUserData(user.uid);
            
            setTimeout(() => hideAlerts(), 3000);
        } catch (error) {
            showAlert('Error updating profile: ' + error.message, 'error');
        }
    });

    // Change password
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const user = auth.currentUser;
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            showAlert('New passwords do not match', 'error');
            return;
        }

        if (newPassword.length < 8) {
            showAlert('Password must be at least 8 characters', 'error');
            return;
        }

        try {
            // Re-authenticate user before changing password
            const credential = EmailAuthProvider.credential(user.email, currentPassword);
            await reauthenticateWithCredential(user, credential);
            await updatePassword(user, newPassword);
            
            showAlert('Password changed successfully!', 'success');
            document.getElementById('passwordForm').reset();
            setTimeout(() => hideAlerts(), 3000);
        } catch (error) {
            if (error.code === 'auth/wrong-password') {
                showAlert('Current password is incorrect', 'error');
            } else {
                showAlert('Error changing password: ' + error.message, 'error');
            }
        }
    });

    // Logout
    document.getElementById('logoutLink').addEventListener('click', async (e) => {
        e.preventDefault();
        await signOut(auth);
        window.location.href = 'login.html';
    });

    // Helper functions for alerts
    function showAlert(message, type) {
        const alertDiv = document.getElementById(`alert${type === 'success' ? 'Success' : 'Error'}`);
        alertDiv.textContent = message;
        alertDiv.style.display = 'block';
        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 5000);
    }

    function hideAlerts() {
        document.getElementById('alertSuccess').style.display = 'none';
        document.getElementById('alertError').style.display = 'none';
    }
</script>
</body>
</html>
