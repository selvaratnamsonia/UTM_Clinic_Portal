<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - UTM Clinic Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #802c44;
            --primary-light: #f4e8ec;
            --primary-hover: #6a2438;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { display: flex; min-height: 100vh; background: var(--bg-body); color: var(--text-dark); }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px; background: var(--white); border-right: 1px solid var(--border-color);
            padding: 30px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; padding: 0 25px 40px; }
        .logo-box { width: 42px; height: 42px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-img { width: 80%; height: 80%; object-fit: contain; }
        .logo-text { font-size: 22px; font-weight: 700; color: var(--primary); }

        .nav-links { display: flex; flex-direction: column; gap: 5px; padding: 0 15px; flex: 1; }
        .nav-link {
            padding: 12px 18px; color: var(--text-muted); border-radius: 12px; font-weight: 500;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; text-decoration: none;
        }
        .nav-link:hover { background: var(--primary-light); color: var(--primary); }
        .nav-link.active { background: var(--primary); color: white; }

        /* --- Main Content --- */
        .main { flex: 1; padding: 40px 60px; max-width: 1100px; }
        header { margin-bottom: 35px; }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); }

        /* --- Alerts --- */
        .alert {
            padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none;
            font-size: 14px; font-weight: 600;
        }
        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        /* --- Form Cards --- */
        .card {
            background: var(--white); padding: 32px; border-radius: var(--radius);
            border: 1px solid var(--border-color); box-shadow: var(--shadow); margin-bottom: 30px;
        }
        .card-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 25px;
            padding-bottom: 15px; border-bottom: 1px solid #f1f5f9;
        }
        .card-header i { color: var(--primary); font-size: 20px; }
        .card-header h2 { font-size: 20px; font-weight: 700; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .full-width { grid-column: span 2; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; font-weight: 600; color: var(--text-dark); }

        input, textarea {
            width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color);
            font-size: 14px; background-color: #fcfcfc; transition: all 0.2s;
        }
        input:focus, textarea:focus {
            outline: none; border-color: var(--primary); background-color: #fff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        input:disabled, textarea:disabled { background-color: #f1f5f9; color: var(--text-muted); cursor: not-allowed; }

        .input-error { border-color: var(--danger) !important; }
        .error-text { color: var(--danger); font-size: 12px; display: none; margin-top: 4px; }
        .error-text.show { display: block; }

        .helper-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* --- Buttons --- */
        .action-buttons { margin-top: 30px; display: flex; gap: 12px; }
        .btn {
            padding: 12px 24px; border-radius: 10px; border: none; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-success { background: var(--success); color: white; }

        @media (max-width: 850px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .main { padding: 30px; }
            .sidebar { width: 80px; }
            .logo-text, .nav-link span { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo-container">
        <div class="logo-box">
            <img src="images/Clinic-logo.png" alt="Logo" class="logo-img">
        </div>
        <div class="logo-text">UTM Clinic</div>
    </div>
    <nav class="nav-links">
        <a href="patient_dashboard.html" class="nav-link"><i class="fas fa-columns"></i> <span>Dashboard</span></a>
        <a href="appointments.html" class="nav-link"><i class="fas fa-calendar-alt"></i> <span>My Appointments</span></a>
        <a href="book-appointment.html" class="nav-link"><i class="fas fa-plus-circle"></i> <span>Book Appointment</span></a>
        <a href="patient-profile.html" class="nav-link active"><i class="fas fa-user-circle"></i> <span>Profile</span></a>
        <a href="login.html" id="logoutLink" class="nav-link" style="margin-top: auto; color: #ef4444;"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
    </nav>
</aside>

<main class="main">
    <header>
        <h1>Profile Settings</h1>
        <p class="subtitle">Keep your information up to date to ensure seamless clinic visits.</p>
    </header>

    <div id="alertSuccess" class="alert alert-success"></div>
    <div id="alertError" class="alert alert-error"></div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-id-card"></i>
            <h2>Personal Information</h2>
        </div>
        <form id="profileForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" value="Sarah Abdullah" disabled>
                </div>
                <div class="form-group">
                    <label>Matric Number</label>
                    <input type="text" id="matricNumber" value="A21EC0000" disabled>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" value="sarah@graduate.utm.my" disabled>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" value="012-3456789" disabled>
                    <span id="phoneError" class="error-text"></span>
                    <span class="helper-text">Format: 01X-XXXXXXX</span>
                </div>
                <div class="form-group full-width">
                    <label>Residential Address / College</label>
                    <textarea id="address" rows="3" disabled>Kolej Tun Dr. Ismail (KTDI), UTM Skudai</textarea>
                    <span id="addressError" class="error-text"></span>
                    <span class="helper-text">e.g., K9, UTM or full off-campus address.</span>
                </div>
            </div>
            <div class="action-buttons">
                <button type="button" id="editBtn" class="btn btn-primary"><i class="fas fa-edit"></i> Edit Profile</button>
                <button type="submit" id="saveBtn" class="btn btn-success" style="display: none;"><i class="fas fa-check"></i> Save Changes</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-shield-alt"></i>
            <h2>Security & Password</h2>
        </div>
        <form id="passwordForm">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Current Password</label>
                    <input type="password" id="currentPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Min. 8 characters" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat new password" required>
                    <span id="passwordMatchError" class="error-text"></span>
                </div>
            </div>
            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">Update Password</button>
            </div>
        </form>
    </div>
</main>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // Reusable Alert Function
    function showAlert(message, type) {
        const successDiv = document.getElementById('alertSuccess');
        const errorDiv = document.getElementById('alertError');
        
        successDiv.style.display = 'none';
        errorDiv.style.display = 'none';

        const activeDiv = type === 'success' ? successDiv : errorDiv;
        activeDiv.textContent = message;
        activeDiv.style.display = 'block';
        
        setTimeout(() => { activeDiv.style.display = 'none'; }, 5000);
    }

    function showFieldError(fieldId, errorId, message) {
        const field = document.getElementById(fieldId);
        const errorDiv = document.getElementById(errorId);
        if (message) {
            field.classList.add('input-error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        } else {
            field.classList.remove('input-error');
            errorDiv.classList.remove('show');
        }
    }

    // Validation Logic
    const validatePhoneNumber = (phone) => {
        const phoneRegex = /^(01[0-9]-?[0-9]{7,8}$)|(01[0-9][0-9]{7,8}$)/;
        if (!phone || phone.trim() === '') return { valid: false, message: 'Phone number is required' };
        if (!phoneRegex.test(phone)) return { valid: false, message: 'Invalid Malaysian format (e.g. 012-3456789)' };
        return { valid: true };
    };

    const validateAddress = (address) => {
        if (!address || address.trim().length < 5) return { valid: false, message: 'Please enter a valid address' };
        return { valid: true };
    };

    // Load Data
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById('name').value = data.name || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('matricNumber').value = data.matricNumber || '';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('address').value = data.address || '';
        }
    });

    // Profile Edit Toggle
    document.getElementById('editBtn').addEventListener('click', () => {
        ['name', 'phone', 'address'].forEach(id => document.getElementById(id).disabled = false);
        document.getElementById('editBtn').style.display = 'none';
        document.getElementById('saveBtn').style.display = 'inline-block';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    });

    document.getElementById('cancelBtn').addEventListener('click', () => location.reload());

    // Submit Profile
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;

        const pVal = validatePhoneNumber(phone);
        const aVal = validateAddress(address);

        showFieldError('phone', 'phoneError', pVal.message);
        showFieldError('address', 'addressError', aVal.message);

        if (pVal.valid && aVal.valid) {
            try {
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, { name: document.getElementById('name').value, phone, address });
                showAlert('Profile updated successfully!', 'success');
                setTimeout(() => location.reload(), 2000);
            } catch (err) { showAlert(err.message, 'error'); }
        }
    });

    // Password Update
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        const currPass = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confPass = document.getElementById('confirmPassword').value;

        if (newPass !== confPass) {
            showFieldError('confirmPassword', 'passwordMatchError', 'Passwords do not match');
            return;
        }

        try {
            const credential = EmailAuthProvider.credential(user.email, currPass);
            await reauthenticateWithCredential(user, credential);
            await updatePassword(user, newPass);
            showAlert('Password updated!', 'success');
            e.target.reset();
        } catch (err) { showAlert(err.message, 'error'); }
    });

    document.getElementById('logoutLink').addEventListener('click', () => signOut(auth).then(() => window.location.href = 'login.html'));
</script>
</body>
</html>
