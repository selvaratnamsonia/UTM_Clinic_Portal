<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-6">
        <h1 class="text-3xl font-bold mb-2">My Profile</h1>
        <p class="text-gray-500 mb-6">Manage your personal information</p>
        <div class="bg-white rounded shadow p-6">
            <form id="profileForm">
                <div class="mb-4">
                    <label class="block mb-1">Full Name</label>
                    <input type="text" id="name" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Email</label>
                    <input type="email" id="email" class="w-full p-2 border rounded bg-gray-100" disabled>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Matric Number</label>
                    <input type="text" id="matric" class="w-full p-2 border rounded bg-gray-100" disabled>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Phone</label>
                    <input type="tel" id="phone" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Address</label>
                    <textarea id="address" rows="3" class="w-full p-2 border rounded"></textarea>
                </div>
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:opacity-90">Save Changes</button>
            </form>
            <hr class="my-6">
            <h2 class="text-xl font-bold mb-4">Change Password</h2>
            <form id="passwordForm">
                <div class="mb-4">
                    <label class="block mb-1">Current Password</label>
                    <input type="password" id="currentPwd" class="w-full p-2 border rounded" required>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">New Password</label>
                    <input type="password" id="newPwd" class="w-full p-2 border rounded" required minlength="8">
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Confirm Password</label>
                    <input type="password" id="confirmPwd" class="w-full p-2 border rounded" required>
                </div>
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:opacity-90">Update Password</button>
            </form>
        </div>
    </div>
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { updatePassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const user = auth.currentUser;
        if (!user) window.location.href = 'login.html';

        // Load profile
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById('name').value = data.name || '';
            document.getElementById('email').value = user.email;
            document.getElementById('matric').value = data.matricNumber || '';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('address').value = data.address || '';
        }

        // Save profile
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await updateDoc(userRef, {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            });
            alert("Profile updated!");
        });

        // Change password
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const current = document.getElementById('currentPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            const confirm = document.getElementById('confirmPwd').value;
            if (newPwd !== confirm) {
                alert("New passwords do not match");
                return;
            }
            try {
                // Re-authenticate user
                const credential = await signInWithEmailAndPassword(auth, user.email, current);
                await updatePassword(credential.user, newPwd);
                alert("Password changed successfully");
                document.getElementById('passwordForm').reset();
            } catch (error) {
                alert("Failed to change password: " + error.message);
            }
        });
    </script>
</body>
</html>
