<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .bg-primary { background-color: #802c44; }
        .text-primary { color: #802c44; }
        .sidebar { width: 260px; }
        @media (max-width: 768px) { .sidebar { width: 80px; } .sidebar span { display: none; } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <aside class="sidebar bg-white border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b flex items-center gap-3">
                <img src="images/utm-logo.png" alt="UTM Logo" class="h-12 mx-auto">
            </div>
            <nav class="flex-1 p-4">
                <a href="staff_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary text-white mb-2 shadow-sm">
                    <i class="fas fa-home w-5"></i> <span>Dashboard</span>
                </a>
                <a href="staff-manage-appointments.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 mb-2">
                    <i class="fas fa-calendar-alt w-5"></i> <span>Manage Appointments</span>
                </a>
                <a href="staff-verify-payment.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100 mb-2">
                    <i class="fas fa-dollar-sign w-5"></i> <span>Verify Payments</span>
                </a>
                <a href="staff-medication-list.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-pills w-5"></i> <span>Medication List</span>
                </a>
            </nav>
            <div class="p-4 border-t">
                <button id="logoutBtn" class="flex items-center gap-3 px-4 py-3 rounded-lg w-full text-gray-700 hover:bg-gray-100 text-left">
                    <i class="fas fa-sign-out-alt w-5"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 p-8">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Staff Dashboard</h1>
                    <p class="text-gray-500">Welcome, <span id="staffName" class="font-medium text-gray-700">Clinic Staff</span></p>
                </div>
                <button id="runTestsBtn" class="bg-gray-800 hover:bg-gray-900 text-white text-xs px-4 py-2 rounded-lg font-mono transition-all">
                    <i class="fas fa-flask mr-1"></i> Run System Tests
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="w-10 h-10 rounded-lg bg-pink-50 flex items-center justify-center mb-4">
                            <i class="fas fa-calendar text-primary text-xl"></i>
                        </div>
                        <h3 class="text-3xl font-bold text-gray-800" id="todayCount">0</h3>
                        <p class="text-sm text-gray-500 mt-1">Today's Appointments</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="w-10 h-10 rounded-lg bg-green-50 flex items-center justify-center mb-4">
                            <i class="fas fa-check-circle text-green-600 text-xl"></i>
                        </div>
                        <h3 class="text-3xl font-bold text-gray-800" id="confirmedCount">0</h3>
                        <p class="text-sm text-gray-500 mt-1">Confirmed (Total)</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="w-10 h-10 rounded-lg bg-yellow-50 flex items-center justify-center mb-4">
                            <i class="fas fa-user-clock text-yellow-600 text-xl"></i>
                        </div>
                        <h3 class="text-3xl font-bold text-gray-800" id="pendingCount">0</h3>
                        <p class="text-sm text-gray-500 mt-1">Pending Confirmation</p>
                    </div>
                </div>
                <div id="paymentMetricCard" class="bg-amber-500 text-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between cursor-pointer hover:bg-amber-600 transition-all">
                    <div>
                        <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center mb-4">
                            <i class="fas fa-dollar-sign text-white text-xl"></i>
                        </div>
                        <h3 class="text-3xl font-bold text-white" id="paymentCount">0</h3>
                        <p class="text-sm text-white/90 mt-1">Payments to Verify</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Today's Appointments</h2>
                    <a href="staff-manage-appointments.html" class="text-sm text-primary font-medium hover:underline">View All</a>
                </div>
                <div id="appointmentsList" class="space-y-3">
                    <div class="text-center py-6 text-gray-400">Loading schedule...</div>
                </div>
            </div>
        </main>
    </div>

<script type="module">
// 1. Import everything directly from the Firebase CDN
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

// 2. Define configuration locally
const firebaseConfig = {
    apiKey: "AIzaSyCVIQytNF0kQ5ZZh1J8Uc56pHhoL1bG90M",
    authDomain: "utm-clinic-portal.firebaseapp.com",
    projectId: "utm-clinic-portal",
    storageBucket: "utm-clinic-portal.firebasestorage.app",
    messagingSenderId: "579361367162",
    appId: "1:579361367162:web:4e45c841ec63756aff07c3",
    measurementId: "G-W1LNRL2VVY"
};

// 3. Initialize local database and auth states
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const appointmentsList = document.getElementById("appointmentsList");
const todayCount = document.getElementById("todayCount");
const confirmedCount = document.getElementById("confirmedCount");
const pendingCount = document.getElementById("pendingCount");
const paymentCount = document.getElementById("paymentCount");
const staffName = document.getElementById("staffName");

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
            staffName.textContent = userDoc.data().name || "Clinic Staff";
        }
    } catch (err) {
        console.error("Failed to load profile:", err);
    }

    loadDashboardData();
});

async function loadDashboardData() {
    appointmentsList.innerHTML = `
        <div class="text-center py-6 text-gray-400">
            <i class="fas fa-spinner fa-spin mr-2"></i> Loading dashboard...
        </div>
    `;

    try {
        const todayDate = new Date().toLocaleDateString('sv-SE'); 
        const appointmentsRef = collection(db, "appointments");

        const todayQuery = query(appointmentsRef, where("date", "==", todayDate));
        const confirmedQuery = query(appointmentsRef, where("status", "==", "confirmed"));
        const pendingQuery = query(appointmentsRef, where("status", "==", "pending"));
        const paymentQuery = query(collection(db, "payments"), where("status", "==", "pending"));

        const [todaySnap, confirmedSnap, pendingSnap, paymentSnap] = await Promise.all([
            getDocs(todayQuery),
            getDocs(confirmedQuery),
            getDocs(pendingQuery),
            getDocs(paymentQuery)
        ]);

        const appointments = [];
        todaySnap.forEach((docSnap) => {
            appointments.push({ id: docSnap.id, ...docSnap.data() });
        });

        todayCount.textContent = appointments.length;
        confirmedCount.textContent = confirmedSnap.size;
        pendingCount.textContent = pendingSnap.size;
        paymentCount.textContent = paymentSnap.size;

        await renderAppointments(appointments);

    } catch (error) {
        console.error("Dashboard error detailed trace:", error);
        appointmentsList.innerHTML = `
            <div class="text-center py-8 text-red-500">
                Failed to load dashboard data. Check browser console logs.
            </div>
        `;
    }
}

async function renderAppointments(appointments) {
    appointmentsList.innerHTML = "";

    if (appointments.length === 0) {
        appointmentsList.innerHTML = `
            <div class="text-center py-8 text-gray-400 border border-dashed rounded-lg bg-gray-50">
                <i class="fas fa-calendar-check text-3xl mb-3"></i>
                <p>No appointments scheduled for today.</p>
            </div>
        `;
        return;
    }

    appointments.sort((a, b) => (a.time || "").localeCompare(b.time || ""));

    const renderedRows = await Promise.all(appointments.map(async (appointment) => {
        let patientName = appointment.patientName || appointment.studentName || "Unknown Patient";

        if (appointment.userId) {
            try {
                const patientDoc = await getDoc(doc(db, "users", appointment.userId));
                if (patientDoc.exists()) {
                    patientName = patientDoc.data().name || patientName;
                }
            } catch (err) {
                console.error("Error fetching patient doc:", err);
            }
        }

        const statusClass = appointment.status === "confirmed" 
            ? "bg-green-100 text-green-700" 
            : "bg-yellow-100 text-yellow-700";

        const row = document.createElement("div");
        row.className = "p-4 bg-gray-50 border border-gray-100 rounded-xl flex justify-between items-center";
        row.innerHTML = `
            <div class="flex items-center gap-6">
                <div class="text-sm font-bold text-gray-700 bg-white px-3 py-2 rounded-lg border shadow-sm min-w-[90px] text-center">
                    ${appointment.time || "--:--"}
                </div>
                <div>
                    <p class="font-semibold text-gray-800">${patientName}</p>
                    <p class="text-xs text-gray-500 mt-1">${appointment.doctorName || "No Doctor Assigned"}</p>
                </div>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusClass}">
                ${appointment.status || "pending"}
            </span>
        `;
        return row;
    }));

    renderedRows.forEach(row => appointmentsList.appendChild(row));
}

document.getElementById("paymentMetricCard")?.addEventListener("click", () => {
    window.location.href = "staff-verify-payment.html";
});

document.getElementById("logoutBtn")?.addEventListener("click", async () => {
    try {
        await signOut(auth);
        window.location.href = "login.html";
    } catch (err) {
        console.error("Logout failed:", err);
    }
});
</script>
</body>
</html>
