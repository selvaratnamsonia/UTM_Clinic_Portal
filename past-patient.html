<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diagnosed Patients List - UTM Clinic</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 font-sans">

  <div class="max-w-6xl mx-auto py-10 px-4">

    <button
      id="backBtn"
      class="flex items-center gap-2 text-[#802c44] hover:underline mb-6"
    >
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Back to Dashboard
    </button>

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">

      <div>
        <h1 class="text-3xl font-bold text-gray-900">
          Diagnosed Patients
        </h1>

        <p class="text-gray-500 mt-1">
          Review historical clinical treatment logs and medical certificates.
        </p>
      </div>

      <div class="relative w-full md:w-80">

        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </span>

        <input
          type="text"
          id="searchBar"
          placeholder="Search patient or matric..."
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-[#802c44]"
        />

      </div>

    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">

      <div id="loadingState" class="p-16 text-center text-gray-500">

        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-[#802c44] mb-4"></div>

        <p class="text-sm font-medium">
          Loading diagnosis records...
        </p>

      </div>

      <div id="emptyState" class="hidden p-16 text-center text-gray-500">

        <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4 text-gray-400">
          <i data-lucide="folder-open" class="w-6 h-6"></i>
        </div>

        <p class="text-lg font-semibold text-gray-700">
          No diagnosis records found
        </p>

      </div>

      <div id="tableWrapper" class="hidden overflow-x-auto">

        <table class="w-full text-left whitespace-nowrap">

          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">

              <th class="px-6 py-4">Patient</th>
              <th class="px-6 py-4">Matric Number</th>
              <th class="px-6 py-4">Diagnosis Date</th>
              <th class="px-6 py-4">Diagnosis Notes</th>
              <th class="px-6 py-4 text-center">MC Status</th>
              <th class="px-6 py-4 text-right">Actions</th>

            </tr>
          </thead>

          <tbody
            id="recordsTableBody"
            class="divide-y divide-gray-100 text-sm"
          >
          </tbody>

        </table>

      </div>

    </div>

  </div>

  <script type="module">

    // Import named 'db' reference from config file
    import { db } from './js/firebase-config.js';

    // Synchronized Firebase module version tracking (v12.13.0)
    import {
      collection,
      getDocs,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // Initialize Icons
    lucide.createIcons();

    // DOM Elements
    const loadingState = document.getElementById("loadingState");
    const emptyState = document.getElementById("emptyState");
    const tableWrapper = document.getElementById("tableWrapper");
    const recordsTableBody = document.getElementById("recordsTableBody");
    const searchBar = document.getElementById("searchBar");

    // Cache Array
    let diagnosticLedgerRecordsCache = [];

    // Layout State Helper
    function showLayoutState(state) {
      loadingState.classList.add("hidden");
      emptyState.classList.add("hidden");
      tableWrapper.classList.add("hidden");

      if (state === "loading") {
        loadingState.classList.remove("hidden");
      } else if (state === "empty") {
        emptyState.classList.remove("hidden");
      } else {
        tableWrapper.classList.remove("hidden");
      }
    }

    // Format Date Utility
    function formatDate(dateValue) {
      try {
        if (!dateValue) return "N/A";

        // Firestore Timestamp
        if (dateValue.toDate) {
          return dateValue.toDate().toLocaleDateString("en-MY", {
            year: "numeric",
            month: "short",
            day: "numeric"
          });
        }

        // ISO String / Native Date Standard
        return new Date(dateValue).toLocaleDateString("en-MY", {
          year: "numeric",
          month: "short",
          day: "numeric"
        });

      } catch (error) {
        return "N/A";
      }
    }

    // Fetch and Build Records Table
    async function loadDiagnosedPatients() {
      try {
        showLayoutState("loading");
        diagnosticLedgerRecordsCache = [];

        if (!db) {
          throw new Error("Firestore 'db' context is missing. Check your firebase-config.js paths.");
        }

        // Get Diagnosis Collection
        const diagnosisSnapshot = await getDocs(collection(db, "diagnosis"));

        if (diagnosisSnapshot.empty) {
          showLayoutState("empty");
          return;
        }

        // Sort Documents (Latest first)
        const sortedDocs = diagnosisSnapshot.docs.sort((a, b) => {
          const aDate = a.data().createdAt ? new Date(a.data().createdAt) : new Date(0);
          const bDate = b.data().createdAt ? new Date(b.data().createdAt) : new Date(0);
          return bDate - aDate;
        });

        // Loop through Diagnosis entries
        for (const recordDoc of sortedDocs) {
          const diagnosisData = recordDoc.data();
          let patientName = "Unknown Patient";
          let matricNumber = "N/A";
          const appointmentId = diagnosisData.appointmentId;

          if (appointmentId) {
            try {
              const appointmentSnap = await getDoc(doc(db, "appointments", appointmentId));

              if (appointmentSnap.exists()) {
                const appointmentData = appointmentSnap.data();
                patientName = appointmentData.patientName || "Unknown Patient";
                matricNumber = appointmentData.matricNumber || "N/A";
              }
            } catch (error) {
              console.error(`Failed to reference appointment data for ID: ${appointmentId}`, error);
            }
          }

          // Push clean structures to ledger cache
          diagnosticLedgerRecordsCache.push({
            id: recordDoc.id,
            patientName,
            matricNumber,
            dateString: formatDate(diagnosisData.createdAt),
            diagnosisNotes: diagnosisData.diagnosisNotes || "No diagnosis notes",
            mcIssued: diagnosisData.mcIssued || false,
            mcDays: diagnosisData.mcDays || 0
          });
        }

        renderRecordsToLayoutTable(diagnosticLedgerRecordsCache);

      } catch (error) {
        console.error("Error loading diagnosis records:", error);
        alert("System Error: " + error.message);
        showLayoutState("empty");
      }
    }

    // Layout Template Engine
    function renderRecordsToLayoutTable(records) {
      if (!records.length) {
        showLayoutState("empty");
        return;
      }

      recordsTableBody.innerHTML = records.map(record => {
        const shortNotes = record.diagnosisNotes.length > 50
          ? record.diagnosisNotes.substring(0, 50) + "..."
          : record.diagnosisNotes;

        return `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-6 py-4 font-semibold text-gray-900">
              ${record.patientName}
            </td>
            <td class="px-6 py-4 text-gray-600 font-mono text-xs">
              ${record.matricNumber}
            </td>
            <td class="px-6 py-4 text-gray-500">
              ${record.dateString}
            </td>
            <td 
              class="px-6 py-4 text-gray-600 max-w-xs truncate" 
              title="${record.diagnosisNotes.replace(/"/g, '&quot;')}"
            >
              ${shortNotes}
            </td>
            <td class="px-6 py-4 text-center">
              ${
                record.mcIssued
                ? `
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>
                    ${record.mcDays} Days MC
                  </span>
                `
                : `
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-500">
                    None
                  </span>
                `
              }
            </td>
            <td class="px-6 py-4 text-right">
              <div class="inline-flex items-center gap-4">
                <button
                  onclick="editMedicalRecordLog('${record.id}')"
                  class="inline-flex items-center gap-1 text-sm font-medium text-amber-600 hover:text-amber-800 hover:underline"
                >
                  <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                  Edit
                </button>

                <button
                  onclick="viewMedicalRecordLog('${record.id}')"
                  class="inline-flex items-center gap-1.5 text-sm font-medium text-[#802c44] hover:underline"
                >
                  <i data-lucide="eye" class="w-4 h-4"></i>
                  View Log
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      lucide.createIcons();
      showLayoutState("table");
    }

    // Live Search Filter Hook
    searchBar.addEventListener("input", (e) => {
      const keyword = e.target.value.toLowerCase().trim();

      if (!keyword) {
        renderRecordsToLayoutTable(diagnosticLedgerRecordsCache);
        return;
      }

      const filteredRecords = diagnosticLedgerRecordsCache.filter(record => {
        const patient = (record.patientName || "").toLowerCase();
        const matric = (record.matricNumber || "").toLowerCase();
        return patient.includes(keyword) || matric.includes(keyword);
      });

      renderRecordsToLayoutTable(filteredRecords);
    });

    // Global Routing Hook: Edit Log Target
    window.editMedicalRecordLog = function(id) {
      window.location.href = `edit_diagnosis.html?id=${id}`;
    };

    // Global Routing Hook: View Log Target
    window.viewMedicalRecordLog = function(id) {
      window.location.href = `view_diagnosis.html?id=${id}`;
    };

    // Routing Navigation Bindings
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "doctor_dashboard.html";
    });

    // Run Initialization Sequence
    loadDiagnosedPatients();

  </script>

</body>
</html>
