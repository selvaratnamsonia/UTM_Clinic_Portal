<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .bg-primary { background-color: #802c44; }
        .text-primary { color: #802c44; }
        .sidebar { width: 260px; }
        @media (max-width: 768px) { .sidebar { width: 80px; } .sidebar span { display: none; } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="sidebar bg-white border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b">
                <img src="assets/LOGOUTM.png" alt="UTM Clinic" class="h-12 mx-auto">
            </div>
            <nav class="flex-1 p-4">
                <a href="staff_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary text-white mb-2">
                    <i class="fas fa-home w-5"></i> <span>Dashboard</span>
                </a>
                <a href="manage-appointments.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-calendar w-5"></i> <span>Manage Appointments</span>
                </a>
                <a href="verify-payments.html" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-dollar-sign w-5"></i> <span>Verify Payments</span>
                </a>
            </nav>
            <div class="p-4 border-t">
                <button id="logoutBtn" class="flex items-center gap-3 px-4 py-3 rounded-lg w-full text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-sign-out-alt w-5"></i> <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <h1 class="text-3xl font-bold">Staff Dashboard</h1>
            <p class="text-gray-500 mb-8">Welcome, <span id="staffName">Staff</span></p>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-lg shadow">
                    <i class="fas fa-calendar text-primary text-2xl mb-2"></i>
                    <h3 class="text-2xl font-bold" id="todayCount">0</h3>
                    <p>Today's Appointments</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <i class="fas fa-check-circle text-green-600 text-2xl mb-2"></i>
                    <h3 class="text-2xl font-bold" id="confirmedCount">0</h3>
                    <p>Confirmed</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <i class="fas fa-clock text-yellow-600 text-2xl mb-2"></i>
                    <h3 class="text-2xl font-bold" id="pendingCount">0</h3>
                    <p>Pending</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow">
                    <i class="fas fa-dollar-sign text-blue-600 text-2xl mb-2"></i>
                    <h3 class="text-2xl font-bold" id="paymentCount">0</h3>
                    <p>Payments to Verify</p>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-4">Today's Appointments</h2>
                <div id="appointmentsList" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        // Protect page
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            // Load staff name
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                document.getElementById('staffName').innerText = userDoc.data().name || 'Staff';
            }
            loadTodayStats(user.uid);
        });

        async function loadTodayStats(staffUid) {
            const today = new Date().toISOString().slice(0,10);
            const q = query(collection(db, "appointments"), where("date", "==", today));
            const snap = await getDocs(q);
            const appointments = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const confirmed = appointments.filter(a => a.status === 'confirmed').length;
            const pending = appointments.filter(a => a.status === 'pending').length;
            document.getElementById('todayCount').innerText = appointments.length;
            document.getElementById('confirmedCount').innerText = confirmed;
            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('paymentCount').innerText = 0; // placeholder

            // Display appointments list
            const container = document.getElementById('appointmentsList');
            if (appointments.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No appointments today.</p>';
                return;
            }
            container.innerHTML = '';
            for (const apt of appointments) {
                // fetch patient name
                let patientName = 'Patient';
                if (apt.userId) {
                    const patientDoc = await getDoc(doc(db, "users", apt.userId));
                    if (patientDoc.exists()) patientName = patientDoc.data().name;
                }
                const div = document.createElement('div');
                div.className = 'p-4 bg-gray-50 rounded-lg flex justify-between items-center';
                div.innerHTML = `
                    <div>
                        <p class="font-medium">${patientName}</p>
                        <p class="text-sm text-gray-500">${apt.reason}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs ${apt.status === 'confirmed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                        ${apt.status}
                    </span>
                `;
                container.appendChild(div);
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
