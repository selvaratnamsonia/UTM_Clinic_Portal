<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Certificate - UTM Clinic</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #802c44;
            --primary-light: #f4e8ec;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); min-height: 100vh; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); text-decoration: none; margin-bottom: 20px; font-weight: 500; }
        .back-btn:hover { text-decoration: underline; }
        .mc-preview { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .mc-header-actions { background: var(--primary-light); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--border-color); }
        .download-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: all 0.2s; }
        .download-btn:hover { background: #6a2438; transform: translateY(-2px); }
        .mc-content { padding: 40px; }
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        @media (max-width: 768px) { body { padding: 20px; } .mc-content { padding: 20px; } }
    </style>
</head>
<body>
<div class="container">
    <a href="appointments.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Appointments</a>
    <div class="mc-preview">
        <div class="mc-header-actions">
            <h2><i class="fas fa-file-medical"></i> Medical Certificate</h2>
            <button id="downloadPDFBtn" class="download-btn"><i class="fas fa-download"></i> Download as PDF</button>
        </div>
        <div id="mcContent" class="mc-content"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading medical certificate...</div></div>
    </div>
</div>

<script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    import { generateMCPDF } from './js/mc-generator.js';

    const urlParams = new URLSearchParams(window.location.search);
    const diagnosisId = urlParams.get('diagnosisId');
    let mcData = null;

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        if (!diagnosisId) {
            document.getElementById('mcContent').innerHTML = `<div class="loading" style="color: red;"><i class="fas fa-exclamation-circle"></i> No medical certificate selected.</div>`;
            return;
        }
        await loadDiagnosisData();
    });

    async function loadDiagnosisData() {
        try {
            const diagnosisRef = doc(db, "diagnosis", diagnosisId);
            const diagnosisSnap = await getDoc(diagnosisRef);
            if (!diagnosisSnap.exists()) {
                document.getElementById('mcContent').innerHTML = `<div class="loading" style="color: red;"><i class="fas fa-exclamation-circle"></i> Diagnosis record not found.</div>`;
                return;
            }
            const diagnosis = diagnosisSnap.data();
            if (!diagnosis.mcIssued) {
                document.getElementById('mcContent').innerHTML = `<div class="loading"><i class="fas fa-info-circle"></i> No medical certificate was issued for this diagnosis.</div>`;
                return;
            }
            
            // Get patient info
            let patientName = "Unknown Patient", matricNumber = "N/A", faculty = "";
            if (diagnosis.userId) {
                const userSnap = await getDoc(doc(db, "users", diagnosis.userId));
                if (userSnap.exists()) {
                    patientName = userSnap.data().name || patientName;
                    matricNumber = userSnap.data().matricNumber || userSnap.data().matric || matricNumber;
                    faculty = userSnap.data().faculty || "";
                }
            }
            
            // Get appointment date
            let appointmentDate = diagnosis.createdAt;
            if (diagnosis.appointmentId) {
                const appointmentSnap = await getDoc(doc(db, "appointments", diagnosis.appointmentId));
                if (appointmentSnap.exists()) appointmentDate = appointmentSnap.data().date || diagnosis.createdAt;
            }
            
            mcData = {
                patientName: patientName,
                matricNumber: matricNumber,
                faculty: faculty,
                doctorName: diagnosis.doctorName || "Clinic Doctor",
                doctorSpecialization: diagnosis.doctorSpecialization || "General Practitioner",
                doctorSignatureUrl: diagnosis.doctorSignatureUrl || "",
                doctorLicenseNumber: diagnosis.doctorLicenseNumber || "",
                mcDays: diagnosis.mcDays || 1,
                diagnosisDate: appointmentDate.split('T')[0] || new Date().toISOString().split('T')[0]
            };
            renderMC();
        } catch (error) {
            console.error("Error loading diagnosis:", error);
            document.getElementById('mcContent').innerHTML = `<div class="loading" style="color: red;"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
        }
    }
    
    function renderMC() {
        if (!mcData) return;
        
        const today = new Date().toLocaleDateString('en-MY', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const currentTime = new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const mcNumber = `PKUJBMC${new Date().toISOString().slice(0,10).replace(/-/g,'')}${Math.floor(Math.random() * 1000)}`;
        
        const startDate = new Date(mcData.diagnosisDate);
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + (mcData.mcDays - 1));
        const formatDate = (date) => date.toLocaleDateString('en-MY', { day: '2-digit', month: '2-digit', year: 'numeric' });
        
        document.getElementById('mcContent').innerHTML = `
            <div class="mc-print-container" style="font-family: 'Times New Roman', serif; max-width: 700px; margin: 0 auto;">
                <div style="border: 2px solid #802c44; padding: 30px; border-radius: 8px;">
                    <div style="text-align: center; margin-bottom: 25px; border-bottom: 2px solid #802c44; padding-bottom: 15px;">
                        <div style="width: 70px; height: 70px; background: #802c44; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 28px; font-weight: bold; margin-bottom: 10px;">UTM</div>
                        <div style="font-size: 22px; font-weight: bold; color: #802c44;">Pusat Kesihatan Universiti</div>
                        <div style="font-size: 13px;">Universiti Teknologi Malaysia</div>
                        <div style="font-size: 11px;">Tel: 07-5537227</div>
                    </div>
                    <div style="text-align: right; font-size: 11px; color: #666; margin-bottom: 15px;">No. Siri: ${mcNumber}</div>
                    <div style="text-align: center; font-size: 18px; font-weight: bold; margin: 25px 0; text-transform: uppercase;">SIJIL AKUAN SAKIT<br><span style="font-size: 12px;">MEDICAL CERTIFICATE</span></div>
                    <p>Saya mengesahkan telah memeriksa:</p>
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; margin: 20px 0;">
                        <div style="margin: 8px 0;"><span style="font-weight: bold; width: 130px; display: inline-block;">Nama / Name</span><span>: <strong>${escapeHtml(mcData.patientName)}</strong></span></div>
                        <div style="margin: 8px 0;"><span style="font-weight: bold; width: 130px; display: inline-block;">No. Matrik / Matric No.</span><span>: <strong>${escapeHtml(mcData.matricNumber)}</strong></span></div>
                        <div style="margin: 8px 0;"><span style="font-weight: bold; width: 130px; display: inline-block;">Fakulti / Faculty</span><span>: <strong>${escapeHtml(mcData.faculty || '—')}</strong></span></div>
                    </div>
                    <p>dan mendapat beliau <strong>TIDAK SIHAT</strong> untuk bertugas / belajar<br>dan telah diberi cuti sakit selama <strong>${mcData.mcDays} HARI</strong></p>
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; margin: 20px 0;">
                        <div style="margin: 8px 0;"><span style="font-weight: bold; width: 130px; display: inline-block;">Dari / From</span><span>: <strong>${formatDate(startDate)}</strong></span></div>
                        <div style="margin: 8px 0;"><span style="font-weight: bold; width: 130px; display: inline-block;">Hingga / To</span><span>: <strong>${formatDate(endDate)}</strong></span></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 40px;">
                        <div><div>Tarikh / Date: ${today}</div><div>Masa Dicetak / Printed: ${currentTime}</div></div>
                        <div style="text-align: center;">
                            ${mcData.doctorSignatureUrl ? 
                                `<img src="${mcData.doctorSignatureUrl}" style="max-width: 180px; max-height: 60px; margin-bottom: 10px;" />` : 
                                `<div style="margin-bottom: 25px;">_________________________</div>`
                            }
                            <div><strong>${escapeHtml(mcData.doctorName)}</strong></div>
                            <div style="font-size: 12px;">${escapeHtml(mcData.doctorSpecialization)}</div>
                            <div style="font-size: 11px;">${escapeHtml(mcData.doctorLicenseNumber || 'PEGAWAI PERUBATAN')}</div>
                            <div style="font-size: 11px;">PUSAT KESIHATAN UNIVERSITI</div>
                            <div style="font-size: 11px;">UNIVERSITI TEKNOLOGI MALAYSIA</div>
                        </div>
                    </div>
                    <div style="margin-top: 25px; text-align: center; font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 12px;">
                        <div>TRUE COPY | SALINAN BENAR</div>
                        <div>Document generated electronically</div>
                    </div>
                </div>
            </div>
        `;
    }
    
    document.getElementById('downloadPDFBtn').addEventListener('click', async () => { if (mcData) await generateMCPDF(mcData); });
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
</script>
</body>
</html>
