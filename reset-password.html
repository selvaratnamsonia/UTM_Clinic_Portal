<!-- reset-password.html -->
<!DOCTYPE html>
<html>
<head>
    <title>New Password - UTM Clinic Portal</title>
    <link rel="stylesheet" href="style.css"> <!-- Reuse your existing styles -->
</head>
<body>
    <div class="form-container">
        <div class="form-box">
            <h2>Set New Password</h2>
            <div id="message" class="status-message"></div>
            
            <form id="resetForm">
                <input type="password" id="newPassword" placeholder="Enter new password" required>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        // 1. Get the 'oobCode' from the URL (the link in the email)
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');
        const form = document.getElementById('resetForm');
        const msg = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;

            try {
                // 2. Verify the code and update the password
                await confirmPasswordReset(auth, actionCode, newPassword);
                
                // 3. Display success message
                msg.textContent = "Password successfully reset! Redirecting to login...";
                msg.style.background = "#d1e7dd";
                msg.style.display = "block";
                form.style.display = "none";

                setTimeout(() => { window.location.href = 'login.html'; }, 3000);
            } catch (error) {
                msg.textContent = "Error: " + error.message;
                msg.style.background = "#f8d7da";
                msg.style.display = "block";
            }
        });
    </script>
</body>
</html>
