<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UTM Clinic Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .bg-primary { background-color: #802c44; }
        .text-primary { color: #802c44; }
        .hover\:bg-primary\/90:hover { background-color: #612134; }
        .focus\:ring-primary:focus { --tw-ring-color: #802c44; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="min-h-screen flex items-center justify-center p-8">
        <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <img src="assets/LOGOUTM.png" alt="UTM Clinic" class="h-20 w-auto mx-auto mb-4">
                <h1 class="text-3xl font-bold mb-2">Create Account</h1>
                <p class="text-gray-500">Register to book appointments at UTM Clinic</p>
            </div>

            <form id="registerForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2 font-medium">Full Name</label>
                        <input type="text" id="name" name="name" required
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block mb-2 font-medium">Email Address</label>
                        <input type="email" id="email" name="email" required
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block mb-2 font-medium">Matric Number</label>
                        <input type="text" id="matricNumber" name="matricNumber" required
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block mb-2 font-medium">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <div>
                    <label class="block mb-2 font-medium">Address</label>
                    <textarea id="address" name="address" rows="3" required
                              class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2 font-medium">Password</label>
                        <input type="password" id="password" name="password" required minlength="8"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block mb-2 font-medium">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <button type="submit"
                        class="w-full bg-primary text-white px-6 py-3 rounded-lg hover:bg-primary/90 transition-colors">
                    Create Account
                </button>
            </form>
            <p class="text-center mt-6 text-sm text-gray-500">
                Already have an account? <a href="index.html" class="text-primary hover:underline">Sign in here</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const matricNumber = document.getElementById('matricNumber').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                // Store patient data in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    matricNumber: matricNumber,
                    phone: phone,
                    address: address,
                    role: "patient",
                    createdAt: new Date().toISOString()
                });
                alert("Registration successful! Please login.");
                window.location.href = "index.html";
            } catch (error) {
                alert("Registration failed: " + error.message);
            }
        });
    </script>
</body>
</html>
