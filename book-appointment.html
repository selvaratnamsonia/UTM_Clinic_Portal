<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - UTM Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-3xl font-bold mb-2">Book Appointment</h1>
        <p class="text-gray-500 mb-6">Request a consultation at the clinic</p>
        <form id="appointmentForm">
            <div class="mb-4">
                <label class="block mb-2">Preferred Date</label>
                <input type="date" id="date" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label class="block mb-2">Reason for Visit</label>
                <textarea id="reason" rows="4" class="w-full p-2 border rounded" required></textarea>
            </div>
            <div class="flex gap-4">
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded hover:opacity-90">Submit</button>
                <button type="button" id="cancelBtn" class="border px-6 py-2 rounded hover:bg-gray-100">Cancel</button>
            </div>
        </form>
        <div id="message" class="mt-4 hidden"></div>
        <div class="mt-6 p-4 bg-blue-50 rounded">
            <h4 class="font-bold text-blue-800">Guidelines</h4>
            <ul class="text-sm text-blue-700 list-disc pl-5">
                <li>Doctor will be assigned after submission</li>
                <li>Free for UTM students & staff</li>
                <li>Bring your ID card</li>
            </ul>
        </div>
    </div>
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { addDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        auth.onAuthStateChanged((user) => {
            if (!user) window.location.href = 'login.html';
        });

        const form = document.getElementById('appointmentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const reason = document.getElementById('reason').value;
            const user = auth.currentUser;
            if (!user) return;

            try {
                await addDoc(collection(db, "appointments"), {
                    userId: user.uid,
                    date: date,
                    reason: reason,
                    status: "pending",
                    doctorId: "",
                    createdAt: new Date().toISOString()
                });
                alert("Appointment booked successfully!");
                window.location.href = "patient_dashboard.html";
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
        document.getElementById('cancelBtn').onclick = () => window.location.href = "patient_dashboard.html";
    </script>
</body>
</html>
